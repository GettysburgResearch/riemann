  <g id="text_25">
   <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; fill: #404b59" transform="translate(77.04 56.002359)">Uniform bounds on the critical parameter box, with the separate cutoff α = 0.004.</text>

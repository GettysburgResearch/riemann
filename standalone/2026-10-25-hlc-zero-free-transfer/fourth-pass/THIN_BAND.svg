  </g>
  <g id="text_26">
   <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #586373" transform="translate(77.04 395.37232)">The full smooth band is U⁰·⁷³⁵ &lt; Nm &lt; 2U⁰·⁷⁷³; fixed factors disappear at exponent scale.</text>
   <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #586373" transform="translate(77.04 407.16)">The high component also uses its longer-inverse endpoint, whose proved margin is 1099/768000.</text>
  </g>

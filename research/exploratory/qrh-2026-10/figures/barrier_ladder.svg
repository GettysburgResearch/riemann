<title id="t">Where the quasi-RH methods stand</title>
<desc id="d">Boundaries sigma0 for zero-free half-planes Re s &gt; sigma0, from trivial (1) to RH (1/2): claimed results, barriers found in the October 2026 wave, and conditional routes.</desc>

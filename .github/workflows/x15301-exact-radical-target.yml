name: x15301-exact-radical-target

on:
  push:
    branches:
      - agent/gpt56-03-j/143-exact-radical-target
    paths:
      - '.github/workflows/x15301-exact-radical-target.yml'
      - 'claims/lemmas/L-1530*.md'
      - 'claims/theorems/T-15301-auxiliary-factor-hurwitz-implies-rh.md'
      - 'experiments/X-15301-codimension-two-source-repair/**'
  pull_request:
    branches:
      - agent/gpt56-pro-09-b/143-squared-residual-floor
    paths:
      - '.github/workflows/x15301-exact-radical-target.yml'
      - 'claims/lemmas/L-1530*.md'
      - 'claims/theorems/T-15301-auxiliary-factor-hurwitz-implies-rh.md'
      - 'experiments/X-15301-codimension-two-source-repair/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-controls:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Compile exact checker
        run: |
          python -m compileall -q \
            experiments/X-15301-codimension-two-source-repair
      - name: Run mutation suite
        run: |
          python -m unittest discover \
            -s experiments/X-15301-codimension-two-source-repair/tests -v
      - name: Replay retained control
        run: |
          python experiments/X-15301-codimension-two-source-repair/verify.py \
            experiments/X-15301-codimension-two-source-repair/certificates/synthetic.json \
            --output /tmp/source-repair.json
          cmp \
            experiments/X-15301-codimension-two-source-repair/results/synthetic-verification.json \
            /tmp/source-repair.json

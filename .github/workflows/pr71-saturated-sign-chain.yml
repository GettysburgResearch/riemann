name: PR71 saturated Hardy-Z sign-chain deflation

on:
  workflow_dispatch:
  push:
    branches:
      - agent/gpt56-08/93-sign-chain-zero-bins
    paths:
      - .github/workflows/pr71-saturated-sign-chain.yml
      - claims/lemmas/L-9305-total-count-saturated-sign-chain.md
      - experiments/X-9304-sign-chain-zero-bins/**

permissions:
  contents: read

concurrency:
  group: pr71-saturated-sign-chain-${{ github.ref }}
  cancel-in-progress: true

jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install rigorous FLINT backends
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y libflint-dev libmpfr-dev libgmp-dev pkg-config
          python -m pip install --upgrade pip
          python -m pip install python-flint==0.9.0
          pkg-config --modversion flint
          python - <<'PY'
          import flint
          print('python-flint', flint.__version__)
          PY

      - name: Compile and test the exact sign-chain layer
        run: |
          set -euo pipefail
          python -m compileall -q \
            experiments/X-9304-sign-chain-zero-bins \
            experiments/X-9301-zero-deflated-xi-modulus
          python -m unittest discover \
            -s experiments/X-9304-sign-chain-zero-bins/tests -v
          python experiments/X-9304-sign-chain-zero-bins/verify_sign_chain.py \
            experiments/X-9304-sign-chain-zero-bins/certificates/synthetic-saturated-chain.json \
            --output /tmp/synthetic-sign-chain-verification.json

      - name: Import the reviewed exact-count source and PR71 guide
        shell: bash
        run: |
          set -euo pipefail
          source_branch=claude/riemann-counterexample-pipeline-io8s2k
          git fetch --no-tags --depth=1 origin "$source_branch"
          source_commit=$(git rev-parse FETCH_HEAD)
          git show "$source_commit:experiments/X-5604-exact-slab-discrepancy/slab_discrepancy.py" \
            >/tmp/slab_discrepancy.py
          git show "$source_commit:experiments/X-5602-riemann-siegel-detector/results/zeros-pr71-ordinate.txt" \
            >/tmp/zeros-pr71-ordinate.txt
          out=experiments/X-9304-sign-chain-zero-bins/results/pr71
          mkdir -p "$out"
          printf '%s\n' "$source_commit" >"$out/x5604-source-commit.txt"
          sha256sum /tmp/slab_discrepancy.py /tmp/zeros-pr71-ordinate.txt \
            >"$out/imported-sources.sha256"

      - name: Recompute and nest the exact total count
        shell: bash
        run: |
          set -euo pipefail
          out=experiments/X-9304-sign-chain-zero-bins/results/pr71
          a=75347258181331/16
          b=37673629090985/8
          target=20225875608341108140435/4294967296
          for precision in 192 256; do
            /usr/bin/time -v python /tmp/slab_discrepancy.py \
              --a "$a" --b "$b" --target "$target" \
              --prec "$precision" --out "$out/count-p${precision}.json" \
              2>"$out/count-p${precision}.time.txt"
          done
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('experiments/X-9304-sign-chain-zero-bins/results/pr71')
          rows=[json.loads((root/f'count-p{p}.json').read_text()) for p in (192,256)]
          for row in rows:
              assert row['schema']=='riemann.x5604-slab-discrepancy.v1'
              assert row['N_total_in_slab']==172
              assert row['N_b']['integer']-row['N_a']['integer']==172
              assert row['target']['strictly_inside'] is True
          assert rows[0]['N_a']['integer']==rows[1]['N_a']['integer']
          assert rows[0]['N_b']['integer']==rows[1]['N_b']['integer']
          (root/'count-comparison.json').write_text(json.dumps({
              'schema':'riemann.x9304-count-comparison.v1',
              'precisions':[192,256],
              'N_a':rows[0]['N_a']['integer'],
              'N_b':rows[0]['N_b']['integer'],
              'N_total':172,
              'verdict':'EXACT_COUNT_172_NESTED_AND_REPRODUCED'
          },indent=2,sort_keys=True)+'\n')
          PY

      - name: Build the directed 173-sample saturated chain
        shell: bash
        run: |
          set -euo pipefail
          out=experiments/X-9304-sign-chain-zero-bins/results/pr71
          python experiments/X-9304-sign-chain-zero-bins/build_sign_chain_certificate.py \
            --guide /tmp/zeros-pr71-ordinate.txt \
            --total-count-source "$out/count-p256.json" \
            --slab-lower 75347258181331/16 \
            --slab-upper 37673629090985/8 \
            --total-count 172 \
            --target 20225875608341108140435/4294967296 \
            --bits 32 --workers 4 \
            --precision-ladder 128,192,256,384,512 \
            --output "$out/chain-initial.json"
          python experiments/X-9304-sign-chain-zero-bins/verify_sign_chain.py \
            "$out/chain-initial.json" \
            --output "$out/chain-initial-verification.json"

      - name: Refine all 172 one-zero bins
        shell: bash
        run: |
          set -euo pipefail
          out=experiments/X-9304-sign-chain-zero-bins/results/pr71
          /usr/bin/time -v python \
            experiments/X-9304-sign-chain-zero-bins/refine_hardy_z_bins.py \
            "$out/chain-initial.json" \
            --output "$out/chain-refined.json" \
            --bins all --rounds 28 --workers 4 \
            --precision-ladder 128,192,256,384,512 \
            2>"$out/chain-refinement.time.txt"
          python experiments/X-9304-sign-chain-zero-bins/verify_sign_chain.py \
            "$out/chain-refined.json" \
            --output "$out/chain-refined-verification.json"
          python - <<'PY'
          import json
          from fractions import Fraction
          from pathlib import Path
          path=Path('experiments/X-9304-sign-chain-zero-bins/results/pr71/chain-refined-verification.json')
          data=json.loads(path.read_text())
          bins=data['bins']
          def f(raw): return Fraction(raw['numerator'],raw['denominator'])
          assert len(bins)==172
          assert all(row['exact_zero_count']==1 and row['simple'] is True for row in bins)
          for left,right in zip(bins,bins[1:]):
              assert f(left['upper']) < f(right['lower']), 'refined zero bins still touch'
          widths=[f(row['width']) for row in bins]
          summary={
              'schema':'riemann.x9304-refinement-summary.v1',
              'bin_count':len(bins),
              'maximum_width':str(max(widths)),
              'minimum_width':str(min(widths)),
              'pairwise_strictly_separated':True,
              'verdict':'172_SIMPLE_LINE_ZEROS_IN_PAIRWISE_DISJOINT_REFINED_BINS'
          }
          path.with_name('chain-refinement-summary.json').write_text(
              json.dumps(summary,indent=2,sort_keys=True)+'\n')
          print(json.dumps(summary,indent=2,sort_keys=True))
          PY

      - name: Generate and compile the exact direct-xi producer
        shell: bash
        run: |
          set -euo pipefail
          out=experiments/X-9304-sign-chain-zero-bins/results/pr71
          python experiments/X-9301-zero-deflated-xi-modulus/build_pr71_rs_source.py \
            --output /tmp/pr71_rs_modulus.c \
            --manifest "$out/direct-xi-source-patch.json"
          cc -O3 -std=c11 -Wall -Wextra \
            /tmp/pr71_rs_modulus.c -o /tmp/pr71_rs_modulus \
            -lflint -lmpfr -lgmp -lpthread -lm
          sha256sum /tmp/pr71_rs_modulus.c \
            >"$out/direct-xi-source.sha256"

      - name: Produce nested direct completed-xi rectangles
        shell: bash
        run: |
          set -euo pipefail
          out=experiments/X-9304-sign-chain-zero-bins/results/pr71
          for precision in 192 256; do
            /usr/bin/time -v /tmp/pr71_rs_modulus "$precision" \
              >"$out/xi-primitives-p${precision}.json" \
              2>"$out/xi-primitives-p${precision}.time.txt"
          done

      - name: Assemble and verify the complete deflation ladder
        shell: bash
        run: |
          set -euo pipefail
          out=experiments/X-9304-sign-chain-zero-bins/results/pr71
          config=experiments/X-9301-zero-deflated-xi-modulus/configs/pr71-deflated-rows.json
          for count in 2 4 8 16 32 64 128 172; do
            for precision in 192 256; do
              python experiments/X-9304-sign-chain-zero-bins/build_x9301_from_sign_chain.py \
                "$out/xi-primitives-p${precision}.json" \
                "$out/chain-refined.json" "$config" \
                --nearest-count "$count" \
                --output "$out/chain-${count}-certificate-p${precision}.json"
              set +e
              python experiments/X-9301-zero-deflated-xi-modulus/verify_zero_deflated_modulus.py \
                "$out/chain-${count}-certificate-p${precision}.json" \
                --output "$out/chain-${count}-verification-p${precision}.json"
              status=$?
              set -e
              test "$status" -le 1
            done
            python experiments/X-9301-zero-deflated-xi-modulus/compare_x9301_precision.py \
              "$out/chain-${count}-certificate-p192.json" \
              "$out/chain-${count}-certificate-p256.json" \
              --output "$out/chain-${count}-precision-comparison.json"
          done

      - name: Summarize every directed row and nominate only strict negatives
        shell: bash
        run: |
          set -euo pipefail
          out=experiments/X-9304-sign-chain-zero-bins/results/pr71
          python - <<'PY'
          import json
          from fractions import Fraction
          from pathlib import Path
          root=Path('experiments/X-9304-sign-chain-zero-bins/results/pr71')
          ladder=[]
          negative=[]
          unresolved=[]
          def midpoint(row):
              lo=row['interval']['lower']; hi=row['interval']['upper']
              a=Fraction(lo['numerator'],lo['denominator'])
              b=Fraction(hi['numerator'],hi['denominator'])
              return (a+b)/2
          for count in (2,4,8,16,32,64,128,172):
              result=json.loads((root/f'chain-{count}-verification-p256.json').read_text())
              tight=min(result['rows'],key=lambda row:abs(midpoint(row)))
              item={
                  'nearest_count':count,
                  'verdict':result['verdict'],
                  'negative_rows':result['certified_negative_rows'],
                  'unresolved_rows':result['unresolved_rows'],
                  'tightest_row_id':tight['id'],
                  'tightest_row_status':tight['status'],
                  'tightest_row_interval':tight['interval'],
              }
              ladder.append(item)
              negative.extend((count,row) for row in result['rows'] if row['status']=='CERTIFIED_NEGATIVE')
              unresolved.extend((count,row) for row in result['rows'] if row['status']=='UNRESOLVED')
          summary={
              'schema':'riemann.x9304-pr71-saturated-chain-summary.v1',
              'target':{'numerator':'20225875608341108140435','denominator':'4294967296'},
              'exact_total_count':172,
              'certified_simple_line_zero_bins':172,
              'ladder':ladder,
              'certified_negative_rows':len(negative),
              'unresolved_rows':len(unresolved),
              'counterexample_nomination':(
                  'PENDING_INDEPENDENT_REPRODUCTION_AND_ANALYTIC_REVIEW'
                  if negative else None
              ),
              'verdict':(
                  'STRICT_NEGATIVE_ZERO_DEFLATED_DIRECT_XI_ROW_FOUND'
                  if negative else
                  ('NO_NEGATIVE_BUT_SOME_ROWS_UNRESOLVED' if unresolved else
                   'NO_NEGATIVE_IN_COMPLETE_DECLARED_LADDER')
              )
          }
          (root/'summary.json').write_text(json.dumps(summary,indent=2,sort_keys=True)+'\n')
          print(json.dumps(summary,indent=2,sort_keys=True))
          PY
          find "$out" -type f ! -name SHA256SUMS -print0 | sort -z | \
            xargs -0 sha256sum >"$out/SHA256SUMS"

      - name: Upload the complete proof and diagnostic artifact set
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr71-saturated-sign-chain-deflation
          path: experiments/X-9304-sign-chain-zero-bins/results/pr71/
          retention-days: 30
          if-no-files-found: warn

name: arb-xi-candidate

on:
  push:
    branches:
      - agent/gpt56-03-e/39-arb-xi-passivity
    paths:
      - '.github/workflows/arb-xi-candidate.yml'
      - 'experiments/X-3902-arb-xi-passivity/rs_candidate_pick.c'
      - 'experiments/X-3902-arb-xi-passivity/verify_certificate.py'
      - 'experiments/X-3902-arb-xi-passivity/verify_value_certificate.py'
  pull_request:
    branches:
      - agent/gpt56-02-e/39-xi-passivity-adversarial-scan
    paths:
      - '.github/workflows/arb-xi-candidate.yml'
      - 'experiments/X-3902-arb-xi-passivity/rs_candidate_pick.c'
      - 'experiments/X-3902-arb-xi-passivity/verify_certificate.py'
      - 'experiments/X-3902-arb-xi-passivity/verify_value_certificate.py'
  workflow_dispatch:

concurrency:
  group: arb-xi-candidate-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install FLINT development library
        run: |
          sudo apt-get update
          sudo apt-get install -y libflint-dev pkg-config
          pkg-config --modversion flint
      - name: Compile frozen producer and exact checker
        run: |
          mkdir -p experiments/X-3902-arb-xi-passivity/results/candidate
          cc -O3 -std=c11 -Wall -Wextra -Werror \
            experiments/X-3902-arb-xi-passivity/rs_candidate_pick.c \
            -o experiments/X-3902-arb-xi-passivity/rs_candidate_pick \
            -lflint -lmpfr -lgmp -lpthread -lm
          python -m compileall -q \
            experiments/X-3902-arb-xi-passivity/verify_certificate.py \
            experiments/X-3902-arb-xi-passivity/verify_value_certificate.py
      - name: Produce and replay directed precision ladder
        run: |
          for bits in 192 256 384 512; do
            /usr/bin/time -v \
              experiments/X-3902-arb-xi-passivity/rs_candidate_pick "$bits" \
              > "experiments/X-3902-arb-xi-passivity/results/candidate/frozen-pick-${bits}.certificate.json" \
              2> "experiments/X-3902-arb-xi-passivity/results/candidate/frozen-pick-${bits}.time.txt"
            python experiments/X-3902-arb-xi-passivity/verify_value_certificate.py \
              "experiments/X-3902-arb-xi-passivity/results/candidate/frozen-pick-${bits}.certificate.json" \
              --output "experiments/X-3902-arb-xi-passivity/results/candidate/frozen-pick-${bits}.verification.json"
            cat "experiments/X-3902-arb-xi-passivity/results/candidate/frozen-pick-${bits}.verification.json"
          done
      - name: Upload frozen precision ladder
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: arb-xi-frozen-pick-candidate
          if-no-files-found: error
          path: experiments/X-3902-arb-xi-passivity/results/candidate/

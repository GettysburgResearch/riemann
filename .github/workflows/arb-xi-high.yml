name: arb-xi-high

on:
  push:
    branches:
      - agent/gpt56-03-e/39-arb-xi-passivity
    paths:
      - '.github/workflows/arb-xi-high.yml'
      - 'experiments/X-3902-arb-xi-passivity/arb_producer.py'
      - 'experiments/X-3902-arb-xi-passivity/arb_value_producer.py'
      - 'experiments/X-3902-arb-xi-passivity/verify_certificate.py'
      - 'experiments/X-3902-arb-xi-passivity/verify_value_certificate.py'
      - 'experiments/X-3902-arb-xi-passivity/configs/high-carrier-scalar.json'
  pull_request:
    branches:
      - agent/gpt56-02-e/39-xi-passivity-adversarial-scan
    paths:
      - '.github/workflows/arb-xi-high.yml'
      - 'experiments/X-3902-arb-xi-passivity/arb_producer.py'
      - 'experiments/X-3902-arb-xi-passivity/arb_value_producer.py'
      - 'experiments/X-3902-arb-xi-passivity/verify_certificate.py'
      - 'experiments/X-3902-arb-xi-passivity/verify_value_certificate.py'
      - 'experiments/X-3902-arb-xi-passivity/configs/high-carrier-scalar.json'
  workflow_dispatch:

concurrency:
  group: arb-xi-high-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  high-scalar:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install rigorous backend
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'python-flint==0.9.0'
      - name: Compile high-height producer and checker
        run: |
          python -m compileall -q \
            experiments/X-3902-arb-xi-passivity/arb_producer.py \
            experiments/X-3902-arb-xi-passivity/arb_value_producer.py \
            experiments/X-3902-arb-xi-passivity/verify_certificate.py \
            experiments/X-3902-arb-xi-passivity/verify_value_certificate.py
      - name: Produce rigorous scalar at optimized carrier
        run: |
          mkdir -p experiments/X-3902-arb-xi-passivity/results
          /usr/bin/time -v python \
            experiments/X-3902-arb-xi-passivity/arb_value_producer.py \
            experiments/X-3902-arb-xi-passivity/configs/high-carrier-scalar.json \
            --output experiments/X-3902-arb-xi-passivity/results/high-carrier-scalar-certificate.json \
            2> experiments/X-3902-arb-xi-passivity/results/high-carrier-scalar.time.txt
          python experiments/X-3902-arb-xi-passivity/verify_value_certificate.py \
            experiments/X-3902-arb-xi-passivity/results/high-carrier-scalar-certificate.json \
            --output experiments/X-3902-arb-xi-passivity/results/high-carrier-scalar-verification.json
          cat experiments/X-3902-arb-xi-passivity/results/high-carrier-scalar-verification.json
      - name: Upload rigorous high-height result
        uses: actions/upload-artifact@v4
        with:
          name: arb-xi-high-carrier-scalar
          path: |
            experiments/X-3902-arb-xi-passivity/results/high-carrier-scalar-certificate.json
            experiments/X-3902-arb-xi-passivity/results/high-carrier-scalar-verification.json
            experiments/X-3902-arb-xi-passivity/results/high-carrier-scalar.time.txt

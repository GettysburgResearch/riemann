name: X9309 exact zero-anchor degree-15 decision

on:
  workflow_dispatch:
  push:
    branches:
      - 'agent/gpt56-01-o/93-run-zero-anchor*'
    paths:
      - experiments/X-9309-zero-anchor-degree15/RUN.md
      - .github/workflows/x9309-zero-anchor-degree15.yml
  pull_request:
    branches:
      - agent/gpt56-01-o/93-zero-anchor-degree15
    paths:
      - experiments/X-9309-zero-anchor-degree15/RUN.md
      - experiments/X-9309-zero-anchor-degree15/**
      - .github/workflows/x9309-zero-anchor-degree15.yml

permissions:
  contents: write

concurrency:
  group: x9309-zero-anchor-${{ github.ref }}
  cancel-in-progress: true

jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install rigorous FLINT backend
        run: |
          sudo apt-get update
          sudo apt-get install -y libflint-dev pkg-config
          pkg-config --modversion flint

      - name: Run exact checker and patch tests
        run: |
          python -m compileall -q experiments/X-9309-zero-anchor-degree15
          python -m unittest discover \
            -s experiments/X-9309-zero-anchor-degree15/tests -v

      - name: Generate the exact critical-line producer
        shell: bash
        run: |
          set -euo pipefail
          out=experiments/X-9309-zero-anchor-degree15/results
          mkdir -p "$out"
          python experiments/X-9301-zero-deflated-xi-modulus/build_pr71_rs_source.py \
            --x-bits 20,19,18,17,16,15,14,13,12,11,10,9,8,7,6,5 \
            --ordinate-numerator 20225875608343133989267 \
            --output /tmp/pr103-grid.c \
            --manifest "$out/base-source-patch.json"
          python experiments/X-9309-zero-anchor-degree15/build_zero_anchor_source.py \
            --source /tmp/pr103-grid.c \
            --output /tmp/zero-anchor.c \
            --manifest "$out/zero-source-patch.json"
          cc -O3 -std=c11 -Wall -Wextra \
            /tmp/zero-anchor.c -o /tmp/zero-anchor \
            -lflint -lmpfr -lgmp -lpthread -lm
          sha256sum /tmp/pr103-grid.c /tmp/zero-anchor.c \
            > "$out/generated-sources.sha256"

      - name: Produce nested 512 and 640 bit zero-anchor rectangles
        shell: bash
        run: |
          set -euo pipefail
          out=experiments/X-9309-zero-anchor-degree15/results
          /usr/bin/time -v /tmp/zero-anchor 512 \
            > "$out/zero-p512.json" 2> "$out/zero-p512.time.txt"
          /usr/bin/time -v /tmp/zero-anchor 640 \
            > "$out/zero-p640.json" 2> "$out/zero-p640.time.txt"

      - name: Decide the complete degree-15 half-line cone
        shell: bash
        run: |
          set -euo pipefail
          out=experiments/X-9309-zero-anchor-degree15/results
          set +e
          /usr/bin/time -v python \
            experiments/X-9309-zero-anchor-degree15/verify_zero_anchor.py \
            --old-certificate \
              experiments/X-9302-total-count-zero-deflation/results/pr71-shift-fine/atomized-min-certificate-p512.json \
            --old-basis \
              experiments/X-9306-real-log-portfolio-search/results/basis.json \
            --zero-low "$out/zero-p512.json" \
            --zero-high "$out/zero-p640.json" \
            --log-terms 240 \
            --decimal-precision 240 \
            --output "$out/verdict.json" \
            > "$out/verdict.stdout" 2> "$out/verdict.time.txt"
          status=$?
          set -e
          test "$status" -le 1
          cat "$out/verdict.stdout"
          python - <<'PY'
          import json
          from pathlib import Path
          result=json.loads(Path('experiments/X-9309-zero-anchor-degree15/results/verdict.json').read_text())
          print(json.dumps({
              'verdict': result['verdict'],
              'b0_interval': result['b0_interval'],
              'schur_theta_midpoint_decimal': result['schur_theta_midpoint_decimal'],
              'schur_midpoint_gap_decimal': result['schur_midpoint_gap_decimal'],
              'exact_proof_object_sha256': result['exact_proof_object_sha256'],
          }, indent=2, sort_keys=True))
          PY
          find "$out" -type f ! -name SHA256SUMS -print0 | sort -z | \
            xargs -0 sha256sum > "$out/SHA256SUMS"

      - name: Commit immutable zero-anchor verdict on branch pushes
        if: github.event_name == 'push'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add experiments/X-9309-zero-anchor-degree15/results
          if git diff --cached --quiet; then
            echo 'No result change to commit'
          else
            git commit -m 'result: retain exact zero-anchor degree15 verdict'
            git push
          fi

      - name: Upload all proof artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: x9309-zero-anchor-degree15
          path: experiments/X-9309-zero-anchor-degree15/results/
          retention-days: 30
          if-no-files-found: error

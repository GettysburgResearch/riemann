name: x18506-publish-on-push

permissions:
  contents: write

on:
  push:
    branches:
      - agent/gpt56-02-p/156-sacrificial-count
    paths:
      - '.github/workflows/x18506-publish-on-push.yml'
      - 'experiments/X-18506-run/**'

jobs:
  directed-ladder-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Verify and extract immutable source bundle
        shell: bash
        run: |
          set -euo pipefail
          test "$(sha256sum experiments/X-18506-source-canonical-ladder.bundle.tar.gz | cut -d' ' -f1)" = "31775b4d6fe240fa96ee7260f849d9a1f992d7556f7f52d782f6f31faeade066"
          rm -rf experiments/X-18506-source-canonical-ladder
          tar -xzf experiments/X-18506-source-canonical-ladder.bundle.tar.gz -C experiments
          cd experiments
          sha256sum -c X-18506-source-canonical-ladder.SOURCE_SHA256SUMS
      - name: Install Arb backend
        run: python -m pip install --disable-pip-version-check python-flint==0.9.0
      - name: Compile and run immutable ladder
        working-directory: experiments/X-18506-source-canonical-ladder
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile arb_producer.py verify.py compare_precisions.py scout.py tests/test_verify.py
          mkdir -p artifacts
          python arb_producer.py config.json --precision-bits 384 --output artifacts/certificate-p384.json
          python verify.py artifacts/certificate-p384.json --output artifacts/verification-p384.json
          python arb_producer.py config.json --precision-bits 512 --output artifacts/certificate-p512.json
          python verify.py artifacts/certificate-p512.json --output artifacts/verification-p512.json
          python compare_precisions.py artifacts/certificate-p384.json artifacts/certificate-p512.json --output artifacts/precision-comparison.json
          PYTHONPATH=. python -m unittest -v tests/test_verify.py 2>&1 | tee artifacts/tests.txt
          python scout.py > artifacts/scout.json
          sha256sum config.json arb_producer.py verify.py compare_precisions.py scout.py tests/test_verify.py artifacts/* > artifacts/SHA256SUMS
      - name: Publish exact sources and directed artifacts on PR branch
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/x18506-publish-on-push.yml
          rm -rf experiments/X-18506-run
          git config user.name 'gpt56-02-p'
          git config user.email 'gpt56-02-p@users.noreply.github.com'
          git add -A
          git commit -m 'experiment: publish directed source-canonical ladder'
          git push origin HEAD:${GITHUB_REF_NAME}

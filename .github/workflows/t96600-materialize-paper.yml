name: T96600 materialize standalone paper

on:
  push:
    branches:
      - paper/arxiv-factor67-two-row-mellin-landau-v1

permissions:
  contents: write

jobs:
  materialize:
    if: ${{ !contains(github.event.head_commit.message, '[t96600 materialized]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Expand deterministic source packet
        run: |
          unzip -o .bootstrap/t96600-source.zip -d .
          rm -f BOOTSTRAP_README.md
          chmod +x standalone/2026-08-17-factor67-two-row-mellin-landau/build.sh
          chmod +x experiments/X-96600-paper-reconstruction/verify.py

      - name: Compile arXiv-style manuscript
        uses: xu-cheng/latex-action@v3
        env:
          SOURCE_DATE_EPOCH: 0
        with:
          root_file: main.tex
          working_directory: standalone/2026-08-17-factor67-two-row-mellin-landau
          args: -pdf -file-line-error -halt-on-error -interaction=nonstopmode

      - name: Name PDF and verify finite algebra
        run: |
          cp standalone/2026-08-17-factor67-two-row-mellin-landau/main.pdf \
             standalone/2026-08-17-factor67-two-row-mellin-landau/factor67-two-row-mellin-landau-proposal.pdf
          python3 experiments/X-96600-paper-reconstruction/verify.py \
            --output /tmp/t96600-verification.json
          cmp /tmp/t96600-verification.json \
              experiments/X-96600-paper-reconstruction/results/verification.json
          find standalone/2026-08-17-factor67-two-row-mellin-landau \
               claims experiments/X-96600-paper-reconstruction \
               integration/2026-08-17 reports/gpt56-pro \
               -type f ! -name '*.aux' ! -name '*.fdb_latexmk' \
               ! -name '*.fls' ! -name '*.log' ! -name '*.out' \
               ! -name '*.toc' ! -name 'main.pdf' -print0 \
            | sort -z | xargs -0 sha256sum > PAPER_96600_GITHUB_SHA256SUMS

      - name: Commit materialized paper and compiled PDF
        run: |
          rm -f standalone/2026-08-17-factor67-two-row-mellin-landau/main.aux \
                standalone/2026-08-17-factor67-two-row-mellin-landau/main.fdb_latexmk \
                standalone/2026-08-17-factor67-two-row-mellin-landau/main.fls \
                standalone/2026-08-17-factor67-two-row-mellin-landau/main.log \
                standalone/2026-08-17-factor67-two-row-mellin-landau/main.out \
                standalone/2026-08-17-factor67-two-row-mellin-landau/main.toc \
                standalone/2026-08-17-factor67-two-row-mellin-landau/main.pdf
          git rm .bootstrap/t96600-source.zip
          rmdir .bootstrap || true
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'paper: materialize T-96600 manuscript and PDF [t96600 materialized]'
          git push origin HEAD:${{ github.ref_name }}

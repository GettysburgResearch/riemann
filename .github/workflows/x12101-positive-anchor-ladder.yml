name: x12101-positive-anchor-ladder

on:
  push:
    branches:
      - agent/gpt56-03-i/93-positive-anchor-ladder
    paths:
      - '.github/workflows/x12101-positive-anchor-ladder.yml'
      - 'claims/lemmas/L-12101-positive-anchor-one-moment-transform.md'
      - 'claims/lemmas/L-12102-multi-anchor-christoffel-ladder.md'
      - 'claims/lemmas/L-12103-certified-line-mass-budget-for-anchor-ladders.md'
      - 'experiments/X-12101-positive-anchor-ladder/**'
      - 'experiments/X-12102-directed-positive-anchor/**'
      - 'experiments/X-12103-anchor-line-mass-budget/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-controls:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Compile exact checkers and discovery script
        run: |
          python -m compileall -q \
            experiments/X-12101-positive-anchor-ladder/verify.py \
            experiments/X-12101-positive-anchor-ladder/reconnaissance.py \
            experiments/X-12101-positive-anchor-ladder/tests \
            experiments/X-12102-directed-positive-anchor/build_positive_anchor_source.py \
            experiments/X-12102-directed-positive-anchor/verify_pa1.py \
            experiments/X-12102-directed-positive-anchor/tests \
            experiments/X-12103-anchor-line-mass-budget/verify.py \
            experiments/X-12103-anchor-line-mass-budget/tests
      - name: Run exact ladder mutation suite
        run: |
          python -m unittest discover \
            -s experiments/X-12101-positive-anchor-ladder/tests -v
      - name: Run directed PA1 helper suite
        run: |
          python -m unittest discover \
            -s experiments/X-12102-directed-positive-anchor/tests -v
      - name: Run line-mass budget mutation suite
        run: |
          python -m unittest discover \
            -s experiments/X-12103-anchor-line-mass-budget/tests -v
      - name: Replay retained positive ladder control
        run: |
          python experiments/X-12101-positive-anchor-ladder/verify.py \
            experiments/X-12101-positive-anchor-ladder/certificates/synthetic-positive.json \
            --output /tmp/positive.json
          cmp \
            experiments/X-12101-positive-anchor-ladder/results/synthetic-positive.verification.json \
            /tmp/positive.json
      - name: Replay retained negative ladder control
        run: |
          python experiments/X-12101-positive-anchor-ladder/verify.py \
            experiments/X-12101-positive-anchor-ladder/certificates/synthetic-negative.json \
            --output /tmp/negative.json
          cmp \
            experiments/X-12101-positive-anchor-ladder/results/synthetic-negative.verification.json \
            /tmp/negative.json
      - name: Replay retained strict line-mass contradiction
        shell: bash
        run: |
          set +e
          python experiments/X-12103-anchor-line-mass-budget/verify.py \
            experiments/X-12103-anchor-line-mass-budget/certificates/synthetic-contradiction.json \
            --output /tmp/line-mass-negative.json
          status=$?
          set -e
          test "$status" -eq 1
          cmp \
            experiments/X-12103-anchor-line-mass-budget/results/synthetic-contradiction.verification.json \
            /tmp/line-mass-negative.json
      - name: Replay retained consistent line-mass control
        run: |
          python experiments/X-12103-anchor-line-mass-budget/verify.py \
            experiments/X-12103-anchor-line-mass-budget/certificates/synthetic-consistent.json \
            --output /tmp/line-mass-positive.json
          cmp \
            experiments/X-12103-anchor-line-mass-budget/results/synthetic-consistent.verification.json \
            /tmp/line-mass-positive.json

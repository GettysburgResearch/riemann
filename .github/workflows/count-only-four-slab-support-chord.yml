name: Count-only support-chord four-slab scan

on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/count-only-four-slab-support-chord.yml
      - claims/lemmas/L-9703-count-only-support-gap-chord.md
      - experiments/X-9703-count-only-support-chord/**
  push:
    branches:
      - agent/gpt56-08/93-support-gap-hausdorff
    paths:
      - .github/workflows/count-only-four-slab-support-chord.yml
      - claims/lemmas/L-9703-count-only-support-gap-chord.md
      - experiments/X-9703-count-only-support-chord/**

permissions:
  contents: read

concurrency:
  group: count-only-four-slab-${{ github.ref }}
  cancel-in-progress: true

jobs:
  certify:
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: pr71
            a: 75347258181331/16
            b: 37673629090985/8
            target: 20225875608341108140435/4294967296
            expected_count: 172
          - id: height-1e13
            a: 20000000000001/2
            b: 20000000001999/2
            target: 10000000000500/1
            expected_count: 4467
          - id: height-1e14
            a: 200000000000001/2
            b: 200000000000101/2
            target: 200000000000051/2
            expected_count: 242
          - id: height-1e15
            a: 2000000000000001/2
            b: 2000000000000021/2
            target: 2000000000000011/2
            expected_count: 52
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install rigorous FLINT backend
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y libflint-dev libmpfr-dev libgmp-dev pkg-config
          python -m pip install --upgrade pip
          python -m pip install python-flint==0.9.0
          pkg-config --modversion flint

      - name: Compile and test the exact checker
        run: |
          set -euo pipefail
          python -m compileall -q experiments/X-9703-count-only-support-chord
          python -m unittest discover \
            -s experiments/X-9703-count-only-support-chord/tests -v
          python experiments/X-9703-count-only-support-chord/verify.py \
            experiments/X-9703-count-only-support-chord/certificates/\
synthetic-empty-slab-hidden-factor.json \
            --output /tmp/synthetic-count-only-verification.json

      - name: Import the reviewed exact-count producer
        shell: bash
        run: |
          set -euo pipefail
          source_branch=claude/riemann-counterexample-pipeline-io8s2k
          git fetch --no-tags --depth=1 origin "$source_branch"
          source_commit=$(git rev-parse FETCH_HEAD)
          git show "$source_commit:experiments/X-5604-exact-slab-discrepancy/slab_discrepancy.py" \
            >/tmp/slab_discrepancy.py
          out=experiments/X-9703-count-only-support-chord/results/${{ matrix.id }}
          mkdir -p "$out"
          printf '%s\n' "$source_commit" >"$out/count-source-commit.txt"
          sha256sum /tmp/slab_discrepancy.py >"$out/count-source.sha256"

      - name: Recompute exact total count at 192 and 256 bits
        shell: bash
        run: |
          set -euo pipefail
          out=experiments/X-9703-count-only-support-chord/results/${{ matrix.id }}
          for precision in 192 256; do
            /usr/bin/time -v python /tmp/slab_discrepancy.py \
              --a '${{ matrix.a }}' --b '${{ matrix.b }}' \
              --target '${{ matrix.target }}' --prec "$precision" \
              --out "$out/count-p${precision}.json" \
              2>"$out/count-p${precision}.time.txt"
          done
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('experiments/X-9703-count-only-support-chord/results/${{ matrix.id }}')
          rows=[json.loads((root/f'count-p{p}.json').read_text()) for p in (192,256)]
          for row in rows:
              assert row['schema']=='riemann.x5604-slab-discrepancy.v1'
              assert row['N_total_in_slab']==${{ matrix.expected_count }}
              assert row['N_b']['integer']-row['N_a']['integer']==${{ matrix.expected_count }}
              assert row['target']['strictly_inside'] is True
          assert rows[0]['N_a']['integer']==rows[1]['N_a']['integer']
          assert rows[0]['N_b']['integer']==rows[1]['N_b']['integer']
          summary={
              'schema':'riemann.x9703-count-comparison.v1',
              'slab_id':'${{ matrix.id }}',
              'precisions':[192,256],
              'N_a':rows[0]['N_a']['integer'],
              'N_b':rows[0]['N_b']['integer'],
              'N_total':${{ matrix.expected_count }},
              'verdict':'EXACT_TOTAL_COUNT_REPRODUCED'
          }
          (root/'count-comparison.json').write_text(json.dumps(summary,indent=2,sort_keys=True)+'\n')
          PY

      - name: Produce support-scaled direct-xi rectangles
        shell: bash
        run: |
          set -euo pipefail
          out=experiments/X-9703-count-only-support-chord/results/${{ matrix.id }}
          config=experiments/X-9703-count-only-support-chord/configs/certified-slabs.json
          for precision in 192 256; do
            /usr/bin/time -v python \
              experiments/X-9703-count-only-support-chord/produce_primitives.py \
              "$config" --slab-id '${{ matrix.id }}' \
              --precision "$precision" --series-cap 2 \
              --output "$out/primitives-p${precision}.json" \
              2>"$out/primitives-p${precision}.time.txt"
          done

      - name: Build and verify all 455 count-adjusted rows
        shell: bash
        run: |
          set -euo pipefail
          out=experiments/X-9703-count-only-support-chord/results/${{ matrix.id }}
          for precision in 192 256; do
            set +e
            python experiments/X-9703-count-only-support-chord/build_certificate.py \
              "$out/primitives-p${precision}.json" "$out/count-p${precision}.json" \
              --log-terms 768 --output "$out/certificate-p${precision}.json"
            status=$?
            set -e
            test "$status" -le 1
            set +e
            python experiments/X-9703-count-only-support-chord/verify.py \
              "$out/certificate-p${precision}.json" \
              --output "$out/verification-p${precision}.json"
            status=$?
            set -e
            test "$status" -le 1
          done

      - name: Require primitive and final-row nesting
        shell: bash
        run: |
          set -euo pipefail
          out=experiments/X-9703-count-only-support-chord/results/${{ matrix.id }}
          python - <<'PY'
          import json
          from fractions import Fraction
          from pathlib import Path
          root=Path('experiments/X-9703-count-only-support-chord/results/${{ matrix.id }}')
          p192=json.loads((root/'primitives-p192.json').read_text())
          p256=json.loads((root/'primitives-p256.json').read_text())
          v192=json.loads((root/'verification-p192.json').read_text())
          v256=json.loads((root/'verification-p256.json').read_text())
          def f(raw): return Fraction(raw['numerator'],raw['denominator'])
          def nested(low,high):
              return f(low['lower']) <= f(high['lower']) <= f(high['upper']) <= f(low['upper'])
          assert [p['id'] for p in p192['points']]==[p['id'] for p in p256['points']]
          primitive_failures=[]
          for low,high in zip(p192['points'],p256['points']):
              assert low['u']==high['u']
              for axis in ('real','imag'):
                  if not nested(low['xi_rectangle'][axis],high['xi_rectangle'][axis]):
                      primitive_failures.append(low['id']+':'+axis)
          assert [r['id'] for r in v192['rows']]==[r['id'] for r in v256['rows']]
          row_failures=[]
          for low,high in zip(v192['rows'],v256['rows']):
              if not nested(low['interval'],high['interval']):
                  row_failures.append(low['id'])
          summary={
              'schema':'riemann.x9703-precision-comparison.v1',
              'slab_id':'${{ matrix.id }}',
              'all_primitives_nested':not primitive_failures,
              'all_rows_nested':not row_failures,
              'primitive_failures':primitive_failures,
              'row_failures':row_failures,
          }
          assert not primitive_failures and not row_failures, summary
          (root/'precision-comparison.json').write_text(json.dumps(summary,indent=2,sort_keys=True)+'\n')
          PY

      - name: Summarize and nominate only a strict directed negative
        shell: bash
        run: |
          set -euo pipefail
          out=experiments/X-9703-count-only-support-chord/results/${{ matrix.id }}
          python - <<'PY'
          import json
          from fractions import Fraction
          from pathlib import Path
          root=Path('experiments/X-9703-count-only-support-chord/results/${{ matrix.id }}')
          result=json.loads((root/'verification-p256.json').read_text())
          def f(raw): return Fraction(raw['numerator'],raw['denominator'])
          def midpoint(row): return (f(row['interval']['lower'])+f(row['interval']['upper']))/2
          tight=min(result['rows'],key=lambda row:abs(midpoint(row)))
          raw_negative=sum(f(row['raw_chord']['upper'])<0 for row in result['rows'])
          summary={
              'schema':'riemann.x9703-production-summary.v1',
              'slab_id':'${{ matrix.id }}',
              'total_count':result['total_count'],
              'support_gap':result['support_gap'],
              'point_count':15,
              'row_count':len(result['rows']),
              'raw_certified_negative_rows':raw_negative,
              'adjusted_verdict':result['verdict'],
              'adjusted_certified_negative_rows':result['certified_negative_rows'],
              'adjusted_unresolved_rows':result['unresolved_rows'],
              'tightest_row_id':tight['id'],
              'tightest_row_status':tight['status'],
              'tightest_row_interval':tight['interval'],
              'counterexample_nomination':(
                  'PENDING_INDEPENDENT_REPRODUCTION_AND_ANALYTIC_REVIEW'
                  if result['certified_negative_rows'] else None
              )
          }
          (root/'summary.json').write_text(json.dumps(summary,indent=2,sort_keys=True)+'\n')
          print(json.dumps(summary,indent=2,sort_keys=True))
          PY
          find "$out" -type f ! -name SHA256SUMS -print0 | sort -z | \
            xargs -0 sha256sum >"$out/SHA256SUMS"

      - name: Upload proof and diagnostic artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: count-only-support-chord-${{ matrix.id }}
          path: experiments/X-9703-count-only-support-chord/results/${{ matrix.id }}/
          retention-days: 30
          if-no-files-found: warn

name: Integration snapshot (read only)

on:
  push:
    branches:
      - integration/first-major-20260801
    paths:
      - .github/workflows/integration-snapshot.yml
      - scripts/integration/capture_snapshot.py
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/integration-snapshot.yml
      - scripts/integration/capture_snapshot.py
  workflow_dispatch:
    inputs:
      cutoff:
        description: ISO-8601 UTC cutoff
        required: false
        default: "2026-08-01T21:35:52Z"

permissions:
  contents: read
  pull-requests: read
  issues: read
  actions: read

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SNAPSHOT_CUTOFF: ${{ inputs.cutoff || '2026-08-01T21:35:52Z' }}
      SNAPSHOT_OUTPUT: snapshot-output
    steps:
      - uses: actions/checkout@v4
      - name: Capture metadata and review evidence
        run: python scripts/integration/capture_snapshot.py
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Upload immutable snapshot payload
        uses: actions/upload-artifact@v4
        with:
          name: integration-snapshot-20260801T213552Z
          path: snapshot-output/
          if-no-files-found: error
          retention-days: 90

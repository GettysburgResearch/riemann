name: arb-xi-passivity

on:
  push:
    branches:
      - agent/gpt56-03-e/39-arb-xi-passivity
  pull_request:
    branches:
      - agent/gpt56-02-e/39-xi-passivity-adversarial-scan
  workflow_dispatch:

concurrency:
  group: arb-xi-passivity-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  arb-xi:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install rigorous backend
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'python-flint==0.9.0'
      - name: Compile and run exact checker tests
        run: |
          python -m compileall -q \
            experiments/X-3902-arb-xi-passivity/probe_api.py \
            experiments/X-3902-arb-xi-passivity/arb_producer.py \
            experiments/X-3902-arb-xi-passivity/verify_certificate.py \
            experiments/X-3902-arb-xi-passivity/tests
          python -m unittest discover \
            -s experiments/X-3902-arb-xi-passivity/tests -v
      - name: Probe rigorous xi series API
        run: |
          mkdir -p experiments/X-3902-arb-xi-passivity/results
          python experiments/X-3902-arb-xi-passivity/probe_api.py \
            | tee experiments/X-3902-arb-xi-passivity/results/api-probe.json
      - name: Upload probe
        uses: actions/upload-artifact@v4
        with:
          name: arb-xi-passivity-probe
          path: experiments/X-3902-arb-xi-passivity/results/api-probe.json

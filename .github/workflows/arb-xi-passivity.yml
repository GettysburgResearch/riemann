name: arb-xi-passivity

on:
  push:
    branches:
      - agent/gpt56-03-e/39-arb-xi-passivity
  pull_request:
    branches:
      - agent/gpt56-02-e/39-xi-passivity-adversarial-scan
  workflow_dispatch:

permissions:
  contents: read

jobs:
  arb-xi:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install rigorous backend
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'python-flint==0.9.0'
      - name: Probe scalar and high-height xi series
        run: |
          mkdir -p experiments/X-3902-arb-xi-passivity/results
          python experiments/X-3902-arb-xi-passivity/probe_api.py \
            | tee experiments/X-3902-arb-xi-passivity/results/api-probe.json
      - name: Upload probe
        uses: actions/upload-artifact@v4
        with:
          name: arb-xi-passivity-probe
          path: experiments/X-3902-arb-xi-passivity/results/api-probe.json

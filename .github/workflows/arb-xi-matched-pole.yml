name: arb-xi-matched-pole

on:
  push:
    branches:
      - agent/gpt56-02-f/39-matched-pole-arb
    paths:
      - '.github/workflows/arb-xi-matched-pole.yml'
      - 'claims/lemmas/L-3904-matched-pole-pick-annihilator.md'
      - 'experiments/X-3903-matched-pole-arb/**'
      - 'experiments/X-3902-arb-xi-passivity/verify_certificate.py'
      - 'experiments/X-3902-arb-xi-passivity/verify_value_certificate.py'
  workflow_dispatch:

concurrency:
  group: arb-xi-matched-pole-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  matched-pole:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install FLINT development library
        run: |
          sudo apt-get update
          sudo apt-get install -y libflint-dev pkg-config
          pkg-config --modversion flint
      - name: Compile producer and run exact algebra tests
        run: |
          mkdir -p experiments/X-3903-matched-pole-arb/results
          set +e
          cc -O3 -std=c11 -Wall -Wextra -Werror \
            experiments/X-3903-matched-pole-arb/rs_matched_pole.c \
            -o experiments/X-3903-matched-pole-arb/rs_matched_pole \
            -lflint -lmpfr -lgmp -lpthread -lm \
            2>&1 | tee experiments/X-3903-matched-pole-arb/results/compile.log
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -ne 0 ]; then exit "$status"; fi
          python -m unittest discover \
            -s experiments/X-3903-matched-pole-arb/tests -v \
            2>&1 | tee experiments/X-3903-matched-pole-arb/results/tests.txt
          python -m compileall -q \
            experiments/X-3903-matched-pole-arb/matched_pole.py \
            experiments/X-3903-matched-pole-arb/tests \
            experiments/X-3902-arb-xi-passivity/verify_certificate.py \
            experiments/X-3902-arb-xi-passivity/verify_value_certificate.py
      - name: Produce and verify directed precision ladder
        run: |
          for prec in 192 256 384 512; do
            /usr/bin/time -v \
              experiments/X-3903-matched-pole-arb/rs_matched_pole "$prec" \
              > "experiments/X-3903-matched-pole-arb/results/matched-pole-${prec}.certificate.json" \
              2> "experiments/X-3903-matched-pole-arb/results/matched-pole-${prec}.time.txt"
            python experiments/X-3902-arb-xi-passivity/verify_value_certificate.py \
              "experiments/X-3903-matched-pole-arb/results/matched-pole-${prec}.certificate.json" \
              --output "experiments/X-3903-matched-pole-arb/results/matched-pole-${prec}.verification.json"
            cat "experiments/X-3903-matched-pole-arb/results/matched-pole-${prec}.verification.json"
          done
      - name: Upload matched-pole certificates and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: arb-xi-matched-pole
          if-no-files-found: warn
          path: |
            experiments/X-3903-matched-pole-arb/results/compile.log
            experiments/X-3903-matched-pole-arb/results/tests.txt
            experiments/X-3903-matched-pole-arb/results/*.certificate.json
            experiments/X-3903-matched-pole-arb/results/*.verification.json
            experiments/X-3903-matched-pole-arb/results/*.time.txt

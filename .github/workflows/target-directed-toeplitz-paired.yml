name: Target directed Toeplitz certificate paired

on:
  workflow_dispatch:
  push:
    branches:
      - agent/gpt56-01-e/28-target-directed-toeplitz
    paths:
      - .github/workflows/target-directed-toeplitz-paired.yml
  pull_request:
    paths:
      - .github/workflows/target-directed-toeplitz-paired.yml
      - experiments/X-2813-target-directed-toeplitz/**

permissions:
  contents: read

env:
  CUTOFF: '100000000000'
  CARRIER: '4709203636353.65'
  CELLS: '1024'
  SEGMENT_SIZE: '500000000'
  PRECISION_BITS: '80'

jobs:
  paired-shards:
    name: paired directed group ${{ matrix.group }}
    runs-on: ubuntu-latest
    timeout-minutes: 330
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        group: [0, 1]
    steps:
      - uses: actions/checkout@v4
      - name: Install MPFR development files
        run: sudo apt-get update && sudo apt-get install -y libmpfr-dev libgmp-dev
      - name: Compile inclusion-preserving accelerated producer
        run: |
          python experiments/X-2813-target-directed-toeplitz/fast_patch.py \
            experiments/X-2813-target-directed-toeplitz/directed_toeplitz_shard.c \
            /tmp/directed_toeplitz_shard_fast.c
          gcc -O3 -march=x86-64-v3 -std=c11 \
            /tmp/directed_toeplitz_shard_fast.c \
            -lmpfr -lgmp -lm -o directed_toeplitz_shard
      - name: Evaluate four disjoint subshards
        shell: bash
        run: |
          set -euo pipefail
          group=${{ matrix.group }}
          base=$((group * 100))
          pids=()
          for local_index in 0 1 2 3; do
            start=$((base + local_index * 25))
            end=$((start + 25))
            higher=0
            if [[ "$start" == '0' ]]; then higher=1; fi
            (
              /usr/bin/time -v ./directed_toeplitz_shard \
                "$CUTOFF" "$CARRIER" "$CELLS" "$SEGMENT_SIZE" \
                "$start" "$end" "$higher" \
                "shard-${start}-${end}.json" "$PRECISION_BITS" \
                2>"shard-${start}-${end}.log"
              test -s "shard-${start}-${end}.json"
            ) &
            pids+=("$!")
          done
          status=0
          for pid in "${pids[@]}"; do
            wait "$pid" || status=1
          done
          exit "$status"
      - uses: actions/upload-artifact@v4
        with:
          name: target-paired-${{ matrix.group }}
          path: |
            shard-*.json
            shard-*.log
          retention-days: 30
          if-no-files-found: error

  merge:
    name: paired exact post-selection and final interval
    needs: paired-shards
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: target-paired-*
          path: shards
          merge-multiple: true
      - run: python -m pip install --upgrade numpy scipy
      - name: Merge, post-select, freeze, and decide
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p results
          mapfile -t files < <(find shards -name 'shard-*.json' -type f | sort -V)
          test "${#files[@]}" -eq 8
          python experiments/X-2813-target-directed-toeplitz/postselect_and_finalize.py \
            "${files[@]}" --bits 96 --outdir results | tee results/finalize.log
          sha256sum "${files[@]}" results/* > results/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: target-directed-certificate-paired
          path: results/
          retention-days: 30
          if-no-files-found: error

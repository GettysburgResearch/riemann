name: PR71 zero-deflated direct-xi modulus

on:
  workflow_dispatch:
  push:
    branches:
      - agent/gpt56-01-i/93-zero-deflated-xi-modulus
    paths:
      - .github/workflows/pr71-zero-deflated-modulus.yml
      - experiments/X-9301-zero-deflated-xi-modulus/**
      - experiments/X-7501-xi-modulus/rs_modulus.c
  pull_request:
    paths:
      - experiments/X-9301-zero-deflated-xi-modulus/RUN_PR71.md
      - .github/workflows/pr71-zero-deflated-modulus.yml
      - experiments/X-9301-zero-deflated-xi-modulus/**
      - experiments/X-7501-xi-modulus/rs_modulus.c

permissions:
  contents: read

concurrency:
  group: pr71-zero-deflated-modulus-${{ github.ref }}
  cancel-in-progress: true

jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install rigorous FLINT backend
        run: |
          sudo apt-get update
          sudo apt-get install -y libflint-dev pkg-config
          pkg-config --modversion flint

      - name: Run exact checker and bridge tests
        run: |
          python -m compileall -q \
            experiments/X-9301-zero-deflated-xi-modulus
          python -m unittest discover \
            -s experiments/X-9301-zero-deflated-xi-modulus/tests -v

      - name: Generate exact PR71 direct-xi source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p experiments/X-9301-zero-deflated-xi-modulus/results/pr71
          python experiments/X-9301-zero-deflated-xi-modulus/build_pr71_rs_source.py \
            --output /tmp/pr71_rs_modulus.c \
            --manifest experiments/X-9301-zero-deflated-xi-modulus/results/pr71/source-patch.json

      - name: Import exact reviewed X-5603 gap source
        shell: bash
        run: |
          set -euo pipefail
          audit_commit=ccb9480b861af1d87c36871e334dc346e9267827
          git fetch --no-tags --depth=50 origin \
            agent/gpt56-02-i/55-pr71-counting-audit
          git cat-file -e "${audit_commit}^{commit}"
          git show "${audit_commit}:experiments/X-5603-pr71-gap-audit/flint_line_gap_discrepancy.c" \
            >/tmp/pr71_gap_discrepancy.c
          printf '%s\n' "$audit_commit" \
            >experiments/X-9301-zero-deflated-xi-modulus/results/pr71/gap-source-commit.txt
          sha256sum \
            /tmp/pr71_gap_discrepancy.c \
            /tmp/pr71_rs_modulus.c \
            experiments/X-9301-zero-deflated-xi-modulus/flint_pr71_hardy_zero_block.c \
            >experiments/X-9301-zero-deflated-xi-modulus/results/pr71/generated-sources.sha256

      - name: Compile rigorous producers
        run: |
          cc -O3 -std=c11 -Wall -Wextra -Werror \
            /tmp/pr71_gap_discrepancy.c -o /tmp/pr71_gap_discrepancy \
            -lflint -lmpfr -lgmp -lpthread -lm
          cc -O3 -std=c11 -Wall -Wextra \
            /tmp/pr71_rs_modulus.c -o /tmp/pr71_rs_modulus \
            -lflint -lmpfr -lgmp -lpthread -lm
          cc -O3 -std=c11 -Wall -Wextra -Werror \
            experiments/X-9301-zero-deflated-xi-modulus/flint_pr71_hardy_zero_block.c \
            -o /tmp/pr71_hardy_zero_block \
            -lflint -lmpfr -lgmp -lpthread -lm

      - name: Produce nested Hardy-zero and Turing certificates
        shell: bash
        run: |
          set -euo pipefail
          out=experiments/X-9301-zero-deflated-xi-modulus/results/pr71
          /usr/bin/time -v /tmp/pr71_gap_discrepancy 192 128 4 \
            >"$out/gap-p192.json" 2>"$out/gap-p192.time.txt"
          /usr/bin/time -v /tmp/pr71_gap_discrepancy 256 128 4 \
            >"$out/gap-p256.json" 2>"$out/gap-p256.time.txt"
          python experiments/X-9301-zero-deflated-xi-modulus/compare_pr71_gap.py \
            "$out/gap-p192.json" "$out/gap-p256.json" \
            --output "$out/gap-comparison.json"

      - name: Produce and compare guarded indexed Hardy-zero blocks
        shell: bash
        run: |
          set -euo pipefail
          out=experiments/X-9301-zero-deflated-xi-modulus/results/pr71
          start=19743642385857
          /usr/bin/time -v /tmp/pr71_hardy_zero_block 192 320 4 "$start" \
            >"$out/zero-block-p192.json" 2>"$out/zero-block-p192.time.txt"
          /usr/bin/time -v /tmp/pr71_hardy_zero_block 256 320 4 "$start" \
            >"$out/zero-block-p256.json" 2>"$out/zero-block-p256.time.txt"
          python experiments/X-9301-zero-deflated-xi-modulus/compare_pr71_zero_block.py \
            "$out/zero-block-p192.json" "$out/zero-block-p256.json" \
            --output "$out/zero-block-comparison.json"

      - name: Produce direct completed-xi rectangles at the exact PR71 ordinate
        shell: bash
        run: |
          set -euo pipefail
          out=experiments/X-9301-zero-deflated-xi-modulus/results/pr71
          for precision in 192 256 384 512; do
            /usr/bin/time -v /tmp/pr71_rs_modulus "$precision" \
              >"$out/xi-primitives-p${precision}.json" \
              2>"$out/xi-p${precision}.time.txt"
          done

      - name: Assemble and verify bracketing-zero certificates
        shell: bash
        run: |
          set -euo pipefail
          out=experiments/X-9301-zero-deflated-xi-modulus/results/pr71
          config=experiments/X-9301-zero-deflated-xi-modulus/configs/pr71-deflated-rows.json
          for precision in 192 256 384 512; do
            python experiments/X-9301-zero-deflated-xi-modulus/build_pr71_certificate.py \
              "$out/xi-primitives-p${precision}.json" \
              "$out/gap-p256.json" "$config" \
              --output "$out/bracketing-certificate-p${precision}.json"
            set +e
            python experiments/X-9301-zero-deflated-xi-modulus/verify_zero_deflated_modulus.py \
              "$out/bracketing-certificate-p${precision}.json" \
              --primitive-artifact "$out/xi-primitives-p${precision}.json" \
              --zero-artifact "$out/gap-p256.json" \
              --output "$out/bracketing-verification-p${precision}.json"
            status=$?
            set -e
            test "$status" -le 1
          done
          for pair in "192 256" "256 384" "384 512"; do
            set -- $pair
            python experiments/X-9301-zero-deflated-xi-modulus/compare_x9301_precision.py \
              "$out/bracketing-certificate-p${1}.json" \
              "$out/bracketing-certificate-p${2}.json" \
              --output \
              "$out/bracketing-precision-comparison-p${1}-p${2}.json"
          done

      - name: Assemble nearest-zero ladders
        shell: bash
        run: |
          set -euo pipefail
          out=experiments/X-9301-zero-deflated-xi-modulus/results/pr71
          config=experiments/X-9301-zero-deflated-xi-modulus/configs/pr71-deflated-rows.json
          for count in 2 4 8 16 32 64 96 128 160 192 224 256; do
            for precision in 192 256 384 512; do
              python experiments/X-9301-zero-deflated-xi-modulus/build_pr71_nearest_certificate.py \
                "$out/xi-primitives-p${precision}.json" \
                "$out/zero-block-p256.json" "$config" \
                --nearest-count "$count" \
                --output "$out/nearest-${count}-certificate-p${precision}.json"
              set +e
              python experiments/X-9301-zero-deflated-xi-modulus/verify_zero_deflated_modulus.py \
                "$out/nearest-${count}-certificate-p${precision}.json" \
                --primitive-artifact "$out/xi-primitives-p${precision}.json" \
                --zero-artifact "$out/zero-block-p256.json" \
                --output "$out/nearest-${count}-verification-p${precision}.json"
              status=$?
              set -e
              test "$status" -le 1
            done
            for pair in "192 256" "256 384" "384 512"; do
              set -- $pair
              python experiments/X-9301-zero-deflated-xi-modulus/compare_x9301_precision.py \
                "$out/nearest-${count}-certificate-p${1}.json" \
                "$out/nearest-${count}-certificate-p${2}.json" \
                --output \
                "$out/nearest-${count}-precision-comparison-p${1}-p${2}.json"
            done
          done

      - name: Exhaust every disjoint minor on the fixed grid
        shell: bash
        run: |
          set -euo pipefail
          out=experiments/X-9301-zero-deflated-xi-modulus/results/pr71
          python \
            experiments/X-9301-zero-deflated-xi-modulus/summarize_pr71_exhaustive_grid.py \
            "$out/xi-primitives-p384.json" \
            "$out/xi-primitives-p512.json" \
            "$out/zero-block-p256.json" \
            --counts 2 4 8 16 32 64 96 128 160 192 224 256 \
            --output "$out/exhaustive-grid-summary.json"

      - name: Summarize and hash proof artifacts
        shell: bash
        run: |
          set -euo pipefail
          out=experiments/X-9301-zero-deflated-xi-modulus/results/pr71
          python \
            experiments/X-9301-zero-deflated-xi-modulus/summarize_pr71_nearest_ladder.py \
            "$out" --zero-block "$out/zero-block-p256.json" \
            --low-precision 384 --high-precision 512 \
            --counts 2 4 8 16 32 64 96 128 160 192 224 256 \
            --output "$out/summary.json"
          find "$out" -type f ! -name SHA256SUMS -print0 | sort -z | \
            xargs -0 sha256sum >"$out/SHA256SUMS"

      - name: Upload every proof and diagnostic artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr71-zero-deflated-xi-modulus
          path: experiments/X-9301-zero-deflated-xi-modulus/results/pr71/
          retention-days: 30
          if-no-files-found: warn

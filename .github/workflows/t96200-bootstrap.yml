name: T96200 materialize affine-volterra hardening packet

on:
  workflow_dispatch:
  push:
    branches:
      - research/gpt56-pro/96200-affine-volterra-score-hardening
    paths:
      - integration/2026-08-16/T96200_PACKET.tar.xz.b64
      - .github/workflows/t96200-bootstrap.yml

permissions:
  contents: write

concurrency:
  group: t96200-materialize
  cancel-in-progress: false

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Decode, verify, and materialize packet
        shell: bash
        run: |
          set -euo pipefail
          P=integration/2026-08-16/T96200_PACKET.tar.xz.b64
          if [[ ! -f "$P" ]]; then
            echo "Packet already materialized."
            exit 0
          fi
          base64 -d "$P" > /tmp/t96200.tar.xz
          echo "5ddb24eb4c0dd1a398a6d495fc5eafb5b3491719f48a40956f2ce342793e9137  /tmp/t96200.tar.xz" | sha256sum -c -
          tar -xJf /tmp/t96200.tar.xz
          rm "$P"

      - name: Replay exact hardening regression
        shell: bash
        run: |
          set -euo pipefail
          cd experiments/X-96200-normalization-score-firewall
          python3 verify.py certificates/control.json --output /tmp/t96200.json
          cmp /tmp/t96200.json results/verification.json
          python3 -m unittest discover -s tests -v
          python3 -m py_compile verify.py tests/test_verify.py
          sha256sum -c SHA256SUMS
          cd ../..
          sha256sum -c standalone/2026-08-16-affine-volterra-hardening/CONTENT_SHA256SUMS
          sha256sum -c T96200_CONTENT_SHA256SUMS

      - name: Commit materialized packet
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet && git diff --cached --quiet && [[ -z "$(git status --porcelain)" ]]; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "harden affine-volterra normalization and tails"
          git push origin HEAD:research/gpt56-pro/96200-affine-volterra-score-hardening

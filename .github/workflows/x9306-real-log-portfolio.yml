name: X9306 real L9308 portfolio search

on:
  workflow_dispatch:
  push:
    branches:
      - agent/gpt56-01-l/93-run-real-log-portfolio
    paths:
      - experiments/X-9306-real-log-portfolio-search/RUN.md
      - .github/workflows/x9306-real-log-portfolio.yml
  pull_request:
    branches:
      - agent/gpt56-01-l/93-real-log-portfolio-search
    paths:
      - experiments/X-9306-real-log-portfolio-search/RUN.md
      - .github/workflows/x9306-real-log-portfolio.yml

permissions:
  contents: write

concurrency:
  group: x9306-real-log-portfolio-${{ github.ref }}
  cancel-in-progress: true

jobs:
  search:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install discovery solver
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy scipy
      - name: Run exact kernel tests
        run: |
          python -m compileall -q experiments/X-9306-real-log-portfolio-search
          python -m unittest discover \
            -s experiments/X-9306-real-log-portfolio-search/tests -v
      - name: Search and exactly replay the smallest atomized PR103 basin
        run: |
          mkdir -p experiments/X-9306-real-log-portfolio-search/results
          /usr/bin/time -v python \
            experiments/X-9306-real-log-portfolio-search/search.py \
            --xi experiments/X-9302-total-count-zero-deflation/results/pr71-shift-fine/p3/xi-primitives-p512.json \
            --complete-result experiments/X-9302-total-count-zero-deflation/results/complete-result.json \
            --output experiments/X-9306-real-log-portfolio-search/results/search.json \
            > experiments/X-9306-real-log-portfolio-search/results/search.stdout \
            2> experiments/X-9306-real-log-portfolio-search/results/search.time.txt
          cat experiments/X-9306-real-log-portfolio-search/results/search.stdout
          sha256sum \
            experiments/X-9306-real-log-portfolio-search/results/search.json \
            experiments/X-9302-total-count-zero-deflation/results/pr71-shift-fine/p3/xi-primitives-p512.json \
            experiments/X-9302-total-count-zero-deflation/results/complete-result.json \
            > experiments/X-9306-real-log-portfolio-search/results/SHA256SUMS
      - name: Commit immutable result on branch pushes
        if: github.event_name == 'push'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add experiments/X-9306-real-log-portfolio-search/results
          if git diff --cached --quiet; then
            echo 'No result change to commit'
          else
            git commit -m 'result: retain exact L9308 portfolio replay'
            git push
          fi
      - name: Upload exact search result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: x9306-real-log-portfolio-search
          path: experiments/X-9306-real-log-portfolio-search/results/
          retention-days: 30
          if-no-files-found: error

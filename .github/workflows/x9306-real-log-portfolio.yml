name: X9307 exact L9309 portfolio-basis decision

on:
  workflow_dispatch:
  push:
    branches:
      - agent/gpt56-01-l/93-run-simplicial-basis
    paths:
      - experiments/X-9306-real-log-portfolio-search/RUN_BASIS.md
      - .github/workflows/x9306-real-log-portfolio.yml
  pull_request:
    branches:
      - agent/gpt56-01-l/93-real-log-portfolio-search
    paths:
      - experiments/X-9306-real-log-portfolio-search/RUN_BASIS.md
      - .github/workflows/x9306-real-log-portfolio.yml

permissions:
  contents: write

concurrency:
  group: x9307-simplicial-basis-${{ github.ref }}
  cancel-in-progress: true

jobs:
  basis:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install parser dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy scipy
      - name: Run exact kernel and basis tests
        run: |
          python -m compileall -q experiments/X-9306-real-log-portfolio-search
          python -m unittest discover \
            -s experiments/X-9306-real-log-portfolio-search/tests -v
      - name: Decide the entire monomial-positive portfolio cone
        run: |
          mkdir -p experiments/X-9306-real-log-portfolio-search/results
          /usr/bin/time -v python \
            experiments/X-9306-real-log-portfolio-search/basis_check.py \
            --xi experiments/X-9302-total-count-zero-deflation/results/pr71-shift-fine/p3/xi-primitives-p512.json \
            --complete-result experiments/X-9302-total-count-zero-deflation/results/complete-result.json \
            --output experiments/X-9306-real-log-portfolio-search/results/basis.json \
            > experiments/X-9306-real-log-portfolio-search/results/basis.stdout \
            2> experiments/X-9306-real-log-portfolio-search/results/basis.time.txt
          cat experiments/X-9306-real-log-portfolio-search/results/basis.stdout
          sha256sum \
            experiments/X-9306-real-log-portfolio-search/results/basis.json \
            experiments/X-9302-total-count-zero-deflation/results/pr71-shift-fine/p3/xi-primitives-p512.json \
            experiments/X-9302-total-count-zero-deflation/results/complete-result.json \
            > experiments/X-9306-real-log-portfolio-search/results/BASIS-SHA256SUMS
      - name: Commit immutable basis verdict on branch pushes
        if: github.event_name == 'push'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add experiments/X-9306-real-log-portfolio-search/results
          if git diff --cached --quiet; then
            echo 'No result change to commit'
          else
            git commit -m 'result: retain exact L9309 portfolio-cone verdict'
            git push
          fi
      - name: Upload exact basis result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: x9307-simplicial-portfolio-basis
          path: experiments/X-9306-real-log-portfolio-search/results/
          retention-days: 30
          if-no-files-found: error

name: T97701 finalize exact PDF bytes

on:
  push:
    branches:
      - research/gpt56-pro/97701-c4mbi67-publication-recovery
    paths:
      - .publish/READY

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Reconstruct and verify the canonical PDF
        shell: bash
        run: |
          set -euo pipefail
          target='standalone/2026-08-18-t97701-c4mbi67-critical-core/t97701-c4mbi67-critical-core.pdf'
          tmp="${target}.tmp"
          cat .publish/t97701-pdf.part-* | base64 --decode > "$tmp"
          echo 'a0e35999df72586ccb615138aa6a55509f79b88633bf067afa64f0b8e6bd097d  '"$tmp" | sha256sum -c -
          test "$(wc -c < "$tmp")" = '14979'
          mv "$tmp" "$target"

      - name: Remove transient publication machinery
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .publish
          rm -f .github/workflows/t97701-binary-finalize.yml

      - name: Commit the exact binary and cleanup
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m 'finalize exact T97701 PDF bytes'
          git push origin HEAD:research/gpt56-pro/97701-c4mbi67-publication-recovery

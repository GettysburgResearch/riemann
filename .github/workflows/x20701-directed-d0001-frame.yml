name: x20701-directed-d0001-frame

on:
  pull_request:
    paths:
      - 'experiments/X-20701-directed-d0001-frame/**'
      - '.github/workflows/x20701-directed-d0001-frame.yml'
  workflow_dispatch:

jobs:
  directed-ladder:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: experiments/X-20701-directed-d0001-frame
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Replay the committed pure-integer 320-bit bundle
        run: |
          python -m py_compile verified_height_320.py
          python verified_height_320.py \
            configs/verified-height-320.json \
            --certificate /tmp/certificate-p320.json \
            --summary /tmp/verification-p320.json
          cmp /tmp/verification-p320.json artifacts/verification-p320.json
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          manifest = json.loads(Path('artifacts/certificate-p320-manifest.json').read_text())
          assert hashlib.sha256(Path('/tmp/certificate-p320.json').read_bytes()).hexdigest() == manifest['certificate_file_sha256']
          assert hashlib.sha256(Path('/tmp/verification-p320.json').read_bytes()).hexdigest() == manifest['summary_file_sha256']
          assert hashlib.sha256(Path('verified_height_320.py').read_bytes()).hexdigest() == manifest['source_file_sha256']
          assert hashlib.sha256(Path('configs/verified-height-320.json').read_bytes()).hexdigest() == manifest['config_file_sha256']
          PY
      - name: Materialize immutable reviewed source blobs
        run: |
          git show 34d8391395d1e08ae986bf5c1c10439f90f9cb57:experiments/X-20701-directed-d0001-frame/arb_producer.py > arb_producer.py
          git show 34d8391395d1e08ae986bf5c1c10439f90f9cb57:experiments/X-20701-directed-d0001-frame/verify.py > verify.py
          test "$(git hash-object arb_producer.py)" = "85bec1e106ba4a0b2cdabb363e0fcb0dc5bdc7b2"
          test "$(git hash-object verify.py)" = "a774ce8e7d7adc4be64d2f197fd1e419130e7eb4"
      - name: Install directed backend
        run: python -m pip install --disable-pip-version-check python-flint==0.9.0
      - name: Compile producer and exact consumer
        run: python -m py_compile arb_producer.py verify.py
      - name: Produce 256-bit ladder
        run: |
          mkdir -p artifacts
          python arb_producer.py configs/support-ladder.json --precision-bits 256 --output artifacts/certificate-p256.json
          python verify.py artifacts/certificate-p256.json --output artifacts/verification-p256.json
      - name: Produce 384-bit ladder
        run: |
          python arb_producer.py configs/support-ladder.json --precision-bits 384 --output artifacts/certificate-p384.json
          python verify.py artifacts/certificate-p384.json --output artifacts/verification-p384.json
      - name: Compare precision ladders
        run: |
          python verify.py --compare artifacts/certificate-p256.json artifacts/certificate-p384.json --output artifacts/precision-comparison.json
      - name: Record hashes and environment
        run: |
          sha256sum arb_producer.py verify.py configs/support-ladder.json artifacts/*.json > artifacts/SHA256SUMS
          python - <<'PY' > artifacts/environment.json
          import importlib.metadata, json, platform, sys
          print(json.dumps({'python': sys.version, 'python_flint': importlib.metadata.version('python-flint'), 'platform': platform.platform()}, indent=2, sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: x20701-directed-d0001-frame
          path: experiments/X-20701-directed-d0001-frame/artifacts
          if-no-files-found: error

name: Reviewer B payload unpack

on:
  push:
    branches:
      - review/2026-08-21/operator-heat-q4
    paths:
      - .review-payload/reviewer-b/unpack.py

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: review/2026-08-21/operator-heat-q4

      - name: Unpack deterministic review payload
        run: python3 .review-payload/reviewer-b/unpack.py

      - name: Validate review registries
        run: |
          python3 - <<'PY'
          import csv
          import json
          from pathlib import Path

          root = Path('review/2026-08-21/operator')
          required = [
              'FREEZE.json', 'CLAIMS.tsv', 'ROUTE_EDGES.tsv', 'ALIASES.tsv',
              'REFUTATIONS.tsv', 'COMPUTATIONS.tsv', 'FIXES.md', 'REPORT.md',
              'INTEGRATION_HANDOFF.md',
          ]
          for name in required:
              path = root / name
              assert path.is_file() and path.stat().st_size > 0, name

          claim_columns = [
              'semantic_id', 'source_pr', 'source_head_sha', 'source_path',
              'source_claim_id', 'statement_short', 'dependencies',
              'quantifier_scope', 'proof_kind', 'mathematical_verdict',
              'evidence_tier', 'required_fix', 'first_broken_arrow',
              'rh_relationship', 'supersedes', 'superseded_by', 'duplicate_of',
              'computation_status', 'canonicalization_recommendation', 'notes',
          ]
          edge_columns = [
              'edge_id', 'premise_semantic_ids', 'conclusion_semantic_id',
              'edge_type', 'source_pr_sha', 'review_verdict',
              'first_missing_input', 'rh_role', 'notes',
          ]
          with (root / 'CLAIMS.tsv').open(newline='', encoding='utf-8') as fh:
              rows = list(csv.DictReader(fh, delimiter='\t'))
              assert fh.closed is False
          assert rows and list(rows[0]) == claim_columns
          assert len(rows) == 167
          assert len({row['semantic_id'] for row in rows}) == 167
          with (root / 'ROUTE_EDGES.tsv').open(newline='', encoding='utf-8') as fh:
              edges = list(csv.DictReader(fh, delimiter='\t'))
          assert edges and list(edges[0]) == edge_columns
          assert len(edges) == 30
          freeze = json.loads((root / 'FREEZE.json').read_text(encoding='utf-8'))
          assert freeze['review_base_sha'] == '677203992eb0168920365ee45ae9db76bfa97dcf'
          assert freeze['scientific_status'] == 'RH_UNPROVED'
          print('PASS_REVIEWER_B_REGISTRY_VALIDATION')
          PY

      - name: Run light exact replays and hash outputs
        run: |
          rm -rf review/2026-08-21/operator/replay/__pycache__
          python3 -m py_compile review/2026-08-21/operator/replay/*.py
          python3 review/2026-08-21/operator/replay/run_all.py
          rm -rf review/2026-08-21/operator/replay/__pycache__
          cd review/2026-08-21/operator/replay
          find . -maxdepth 1 -type f ! -name SHA256SUMS -printf '%f\n' | LC_ALL=C sort | xargs sha256sum > SHA256SUMS
          sha256sum -c SHA256SUMS

      - name: Commit review artifacts
        run: |
          git config user.name "Reviewer B"
          git config user.email "reviewer-b@users.noreply.github.com"
          git add -- review/2026-08-21/operator
          git diff --cached --quiet && exit 0
          git commit -m "review: add operator heat q4 registries and replay"
          git push

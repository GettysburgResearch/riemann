name: integration-2026-09-06

on:
  push:
    branches: [main]
    paths:
      - 'integration/2026-09-06/**'
      - 'canonical/**'
      - 'research/integrated/**'
      - 'research/RESULTS_INDEX.md'
      - 'reviews/**'
      - '*.md'
      - 'docs/**'
      - 'formal/README.md'
      - '.github/workflows/integration-2026-09-06.yml'
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'integration/2026-09-06/**'
      - 'canonical/**'
      - 'research/integrated/**'
      - 'research/RESULTS_INDEX.md'
      - 'reviews/**'
      - '*.md'
      - 'docs/**'
      - 'formal/README.md'
      - '.github/workflows/integration-2026-09-06.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: integration-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  bounded-integration-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact proposed head without persistent credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          persist-credentials: false
          submodules: false
      - name: Run synthetic rejection and navigation contracts in both modes
        shell: bash
        run: |
          set -euo pipefail
          python3 -I -S -B integration/2026-09-06/hardening/test_verify.py > "$RUNNER_TEMP/hardening-tests.normal.json"
          python3 -I -S -B -O integration/2026-09-06/hardening/test_verify.py > "$RUNNER_TEMP/hardening-tests.optimized.json"
          diff -u "$RUNNER_TEMP/hardening-tests.normal.json" "$RUNNER_TEMP/hardening-tests.optimized.json"
      - name: Check actual graph dependencies in both modes
        shell: bash
        run: |
          set -euo pipefail
          python3 -I -S -B integration/2026-09-06/graph-fix/test_graph_dependencies.py > "$RUNNER_TEMP/graph-tests.normal.json"
          python3 -I -S -B -O integration/2026-09-06/graph-fix/test_graph_dependencies.py > "$RUNNER_TEMP/graph-tests.optimized.json"
          diff -u "$RUNNER_TEMP/graph-tests.normal.json" "$RUNNER_TEMP/graph-tests.optimized.json"
      - name: Authenticate actual inputs and validate the scoped release
        shell: bash
        run: |
          set -euo pipefail
          python3 -I -S -B integration/2026-09-06/hardening/verify.py --output "$RUNNER_TEMP/integration-normal"
          python3 -I -S -B -O integration/2026-09-06/hardening/verify.py --output "$RUNNER_TEMP/integration-optimized"
          diff -r "$RUNNER_TEMP/integration-normal" "$RUNNER_TEMP/integration-optimized"
      - name: Retain exact validation receipts, not a new research campaign
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: integration-audit-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            ${{ runner.temp }}/integration-normal
            ${{ runner.temp }}/integration-optimized
            ${{ runner.temp }}/hardening-tests.*.json
            ${{ runner.temp }}/graph-tests.*.json
          if-no-files-found: error
          retention-days: 14

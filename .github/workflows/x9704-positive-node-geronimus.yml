name: X9704 positive-node Geronimus Schur gates

on:
  workflow_dispatch:
  push:
    branches:
      - agent/gpt56-08/93-positive-node-geronimus
    paths:
      - .github/workflows/x9704-positive-node-geronimus.yml
      - claims/lemmas/L-9704-positive-node-geronimus-schur-gate.md
      - experiments/X-9704-positive-node-geronimus/**
  pull_request:
    paths:
      - .github/workflows/x9704-positive-node-geronimus.yml
      - claims/lemmas/L-9704-positive-node-geronimus-schur-gate.md
      - experiments/X-9704-positive-node-geronimus/**

permissions:
  contents: read

concurrency:
  group: x9704-positive-node-${{ github.ref }}
  cancel-in-progress: true

jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install rigorous FLINT backend
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y libflint-dev libmpfr-dev libgmp-dev pkg-config
          pkg-config --modversion flint

      - name: Compile and test the exact checker
        run: |
          set -euo pipefail
          python -m compileall -q experiments/X-9704-positive-node-geronimus
          python -m unittest discover \
            -s experiments/X-9704-positive-node-geronimus/tests -v
          python experiments/X-9704-positive-node-geronimus/verify.py \
            experiments/X-9704-positive-node-geronimus/certificates/synthetic-positive.json \
            --output /tmp/synthetic-positive-verification.json

      - name: Compile directed positive-node producer
        run: |
          set -euo pipefail
          cc -O3 -std=c11 -Wall -Wextra -Werror \
            experiments/X-9704-positive-node-geronimus/positive_node_rs.c \
            -o /tmp/positive_node_rs \
            -lflint -lmpfr -lgmp -lpthread -lm

      - name: Produce nested x=1,2,4,8 direct-xi rectangles
        shell: bash
        run: |
          set -euo pipefail
          out=experiments/X-9704-positive-node-geronimus/results/pr103
          mkdir -p "$out"
          target=20225875608343133989267
          for precision in 512 640; do
            /usr/bin/time -v /tmp/positive_node_rs "$precision" "$target" \
              >"$out/primitives-p${precision}.json" \
              2>"$out/primitives-p${precision}.time.txt"
          done
          sha256sum \
            experiments/X-9704-positive-node-geronimus/positive_node_rs.c \
            "$out"/primitives-p*.json \
            >"$out/primitive-sources.sha256"

      - name: Build and verify all four one-point Schur gates
        shell: bash
        run: |
          set -euo pipefail
          out=experiments/X-9704-positive-node-geronimus/results/pr103
          old=experiments/X-9302-total-count-zero-deflation/results/pr71-shift-fine/atomized-min-certificate-p512.json
          basis=experiments/X-9306-real-log-portfolio-search/results/basis.json
          for spec in \
            'xp0 1/10000000 1/10000000' \
            'xp1 1/10000000000000 1/10000000000000' \
            'xp2 1/1000000000000000000000 1/1000000000000000000000' \
            'xp3 1/1000000000000000000000000000000 1/1000000000000000000000000000000'; do
            set -- $spec
            point=$1
            delta0=$2
            delta1=$3
            for precision in 512 640; do
              set +e
              python experiments/X-9704-positive-node-geronimus/build_candidate.py \
                "$old" "$basis" "$out/primitives-p${precision}.json" \
                --point-id "$point" --reference-id x-5 \
                --delta0 "$delta0" --delta1 "$delta1" \
                --log-terms 300 \
                --output "$out/${point}-certificate-p${precision}.json" \
                >"$out/${point}-build-p${precision}.stdout"
              status=$?
              set -e
              test "$status" -le 1
              set +e
              python experiments/X-9704-positive-node-geronimus/verify.py \
                "$out/${point}-certificate-p${precision}.json" \
                --output "$out/${point}-verification-p${precision}.json" \
                >"$out/${point}-verify-p${precision}.stdout"
              status=$?
              set -e
              test "$status" -le 1
            done
          done

      - name: Require primitive and scalar nesting
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from fractions import Fraction
          from pathlib import Path

          root=Path('experiments/X-9704-positive-node-geronimus/results/pr103')
          low=json.loads((root/'primitives-p512.json').read_text())
          high=json.loads((root/'primitives-p640.json').read_text())

          def f(raw): return Fraction(raw['numerator'],raw['denominator'])
          def nested(a,b):
              return f(a['lower']) <= f(b['lower']) <= f(b['upper']) <= f(a['upper'])

          assert [p['id'] for p in low['points']]==[p['id'] for p in high['points']]
          primitive_failures=[]
          for lp,hp in zip(low['points'],high['points']):
              for coordinate in ('real','imag'):
                  if not nested(lp['xi_rectangle'][coordinate],hp['xi_rectangle'][coordinate]):
                      primitive_failures.append([lp['id'],coordinate])
          assert not primitive_failures, primitive_failures

          candidates=[]
          for point in ('xp0','xp1','xp2','xp3'):
              c512=json.loads((root/f'{point}-certificate-p512.json').read_text())
              c640=json.loads((root/f'{point}-certificate-p640.json').read_text())
              v512=json.loads((root/f'{point}-verification-p512.json').read_text())
              v640=json.loads((root/f'{point}-verification-p640.json').read_text())
              assert nested(c512['b0_interval'],c640['b0_interval'])
              assert v640['lower_schur_witness_interval']['lower']['denominator']>0
              assert v640['upper_schur_witness_interval']['lower']['denominator']>0
              candidates.append({
                  'point_id':point,
                  'w':c640['w'],
                  'b0_interval':c640['b0_interval'],
                  'verdict_p512':v512['verdict'],
                  'verdict_p640':v640['verdict'],
                  'g0_radius':v640['g0_maximum_row_radius'],
                  'g1_radius':v640['g1_maximum_row_radius'],
                  'lower_witness_interval':v640['lower_schur_witness_interval'],
                  'upper_witness_interval':v640['upper_schur_witness_interval'],
                  'negative_rows':v640['negative_rows'],
              })
          negative=sum((row['negative_rows'] for row in candidates),[])
          unresolved=[row for row in candidates if row['verdict_p640']=='UNRESOLVED']
          summary={
              'schema':'riemann.x9704-pr103-summary.v1',
              'ordinate':high['ordinate'],
              'primitive_precisions':[512,640],
              'primitive_rectangles_nested':True,
              'candidates':candidates,
              'negative_rows':len(negative),
              'unresolved_candidates':len(unresolved),
              'counterexample_nomination':(
                  'PENDING_INDEPENDENT_REPRODUCTION_AND_ANALYTIC_REVIEW'
                  if negative else None
              ),
              'verdict':(
                  'STRICT_NEGATIVE_POSITIVE_NODE_RESPONSE_FOUND'
                  if negative else
                  ('NO_NEGATIVE_BUT_SOME_GATES_UNRESOLVED' if unresolved else
                   'ALL_FOUR_FULL_NEXT_DEGREE_CONES_CERTIFIED_POSITIVE')
              )
          }
          (root/'summary.json').write_text(json.dumps(summary,indent=2,sort_keys=True)+'\n')
          print(json.dumps(summary,indent=2,sort_keys=True))
          PY
          out=experiments/X-9704-positive-node-geronimus/results/pr103
          find "$out" -type f ! -name SHA256SUMS -print0 | sort -z | \
            xargs -0 sha256sum >"$out/SHA256SUMS"

      - name: Upload proof and candidate artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: x9704-positive-node-geronimus
          path: experiments/X-9704-positive-node-geronimus/results/pr103/
          retention-days: 30
          if-no-files-found: warn

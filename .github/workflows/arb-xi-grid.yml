name: arb-xi-grid

on:
  push:
    branches:
      - agent/gpt56-03-e/39-arb-xi-passivity
    paths:
      - '.github/workflows/arb-xi-grid.yml'
      - 'experiments/X-3902-arb-xi-passivity/rs_grid.c'
      - 'experiments/X-3902-arb-xi-passivity/verify_certificate.py'
      - 'experiments/X-3902-arb-xi-passivity/verify_value_certificate.py'
      - 'experiments/X-3902-arb-xi-passivity/summarize_value_verification.py'
  pull_request:
    branches:
      - agent/gpt56-02-e/39-xi-passivity-adversarial-scan
    paths:
      - '.github/workflows/arb-xi-grid.yml'
      - 'experiments/X-3902-arb-xi-passivity/rs_grid.c'
      - 'experiments/X-3902-arb-xi-passivity/verify_certificate.py'
      - 'experiments/X-3902-arb-xi-passivity/verify_value_certificate.py'
      - 'experiments/X-3902-arb-xi-passivity/summarize_value_verification.py'
  workflow_dispatch:

concurrency:
  group: arb-xi-grid-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  grid:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install FLINT development library
        run: |
          sudo apt-get update
          sudo apt-get install -y libflint-dev pkg-config
          pkg-config --modversion flint
      - name: Compile rigorous grid and exact checker
        run: |
          mkdir -p experiments/X-3902-arb-xi-passivity/results
          set +e
          cc -O3 -std=c11 -Wall -Wextra -Werror \
            experiments/X-3902-arb-xi-passivity/rs_grid.c \
            -o experiments/X-3902-arb-xi-passivity/rs_grid \
            -lflint -lmpfr -lgmp -lpthread -lm \
            2>&1 | tee experiments/X-3902-arb-xi-passivity/results/grid-compile.log
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -ne 0 ]; then exit "$status"; fi
          python -m compileall -q \
            experiments/X-3902-arb-xi-passivity/verify_certificate.py \
            experiments/X-3902-arb-xi-passivity/verify_value_certificate.py \
            experiments/X-3902-arb-xi-passivity/summarize_value_verification.py
      - name: Produce and replay rigorous value grid
        run: |
          /usr/bin/time -v \
            experiments/X-3902-arb-xi-passivity/rs_grid 128 \
            > experiments/X-3902-arb-xi-passivity/results/high-carrier-grid-certificate.json \
            2> experiments/X-3902-arb-xi-passivity/results/high-carrier-grid.time.txt
          python experiments/X-3902-arb-xi-passivity/verify_value_certificate.py \
            experiments/X-3902-arb-xi-passivity/results/high-carrier-grid-certificate.json \
            --output experiments/X-3902-arb-xi-passivity/results/high-carrier-grid-verification.json
          python experiments/X-3902-arb-xi-passivity/summarize_value_verification.py \
            experiments/X-3902-arb-xi-passivity/results/high-carrier-grid-verification.json \
            --certificate experiments/X-3902-arb-xi-passivity/results/high-carrier-grid-certificate.json \
            --time-file experiments/X-3902-arb-xi-passivity/results/high-carrier-grid.time.txt \
            --output experiments/X-3902-arb-xi-passivity/results/high-carrier-grid-summary.json
      - name: Upload rigorous grid and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: arb-xi-high-carrier-grid
          if-no-files-found: warn
          path: |
            experiments/X-3902-arb-xi-passivity/results/grid-compile.log
            experiments/X-3902-arb-xi-passivity/results/high-carrier-grid-certificate.json
            experiments/X-3902-arb-xi-passivity/results/high-carrier-grid-verification.json
            experiments/X-3902-arb-xi-passivity/results/high-carrier-grid-summary.json
            experiments/X-3902-arb-xi-passivity/results/high-carrier-grid.time.txt

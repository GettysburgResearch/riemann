name: Publish recent zeta manuscript PDF

# Deliberately scoped to this manuscript branch and this workflow file.
# Publishing the PDF does not retrigger this workflow or change main.
on:
  push:
    branches: [paper/recent-zeta-contributions-20261019]
    paths: [.github/workflows/publish-recent-zeta-pdf.yml]

permissions:
  contents: write

concurrency:
  group: publish-recent-zeta-manuscript-pdf
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PAPER: papers/2026-10-19-arithmetic-transfers-theta-approximants
    steps:
      - name: Check out the exact triggering commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          sparse-checkout: |
            papers/2026-10-19-arithmetic-transfers-theta-approximants
            .github/workflows
      - name: Install the PDF toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends texlive-latex-recommended lmodern poppler-utils
      - name: Authenticate the unchanged manuscript, check, and compile
        run: |
          cd "$PAPER"
          sha256sum -c SHA256SUMS
          python3 -I -S -B build.py
          test "$(pdfinfo main.pdf | awk '/^Pages:/ {print $2}')" = 36
          sha256sum main.pdf > main.pdf.sha256
          {
            echo '# Compiled PDF publication'
            echo
            echo 'The compiled 36-page manuscript is now stored as [main.pdf](main.pdf).'
            echo 'The LaTeX content and all scientific qualifications are unchanged.'
            echo 'This publication does not submit to arXiv or merge the manuscript.'
            echo
            echo 'Original manuscript source commit: bb9e81af4a4d76fd6696bd7bf8b868cd30392b76.'
            echo "Build source commit: ${GITHUB_SHA}."
            echo "Build run: https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo
            echo 'The original source manifest, paper checks, three no-shell-escape pdfLaTeX passes,'
            echo 'and the 36-page check passed. The PDF checksum is in main.pdf.sha256.'
            echo 'A rebuild may differ in PDF metadata from an earlier local compilation.'
            echo 'This is a compilation check, not an independent mathematical review.'
          } > PDF_PUBLICATION.md
      - name: Publish the PDF to the same manuscript branch
        run: |
          set -euo pipefail
          branch=paper/recent-zeta-contributions-20261019
          current=$(git ls-remote origin "refs/heads/$branch" | cut -f1)
          test "$current" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f "$PAPER/main.pdf"
          git add "$PAPER/main.pdf.sha256" "$PAPER/PDF_PUBLICATION.md"
          git diff --cached --stat
          git commit -m 'paper: publish compiled 36-page manuscript PDF and build receipt'
          git push origin "HEAD:refs/heads/$branch"
      - name: Provide the exact published PDF as a downloadable artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: recent-zeta-manuscript-pdf
          path: |
            papers/2026-10-19-arithmetic-transfers-theta-approximants/main.pdf
            papers/2026-10-19-arithmetic-transfers-theta-approximants/main.pdf.sha256
            papers/2026-10-19-arithmetic-transfers-theta-approximants/PDF_PUBLICATION.md
          if-no-files-found: error
          retention-days: 7

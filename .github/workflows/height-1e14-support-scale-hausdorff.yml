name: Height 1e14 support-scale Hausdorff search

on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/height-1e14-support-scale-hausdorff.yml
      - claims/lemmas/L-9306-total-count-saturated-sign-chain.md
      - claims/lemmas/L-9307-support-gap-hausdorff-residual.md
      - experiments/X-9304-sign-chain-zero-bins/**
      - experiments/X-9305-support-gap-hausdorff/**
  push:
    branches:
      - agent/gpt56-08/93-support-gap-hausdorff
    paths:
      - .github/workflows/height-1e14-support-scale-hausdorff.yml
      - experiments/X-9304-sign-chain-zero-bins/build_gram_sign_chain_certificate.py
      - experiments/X-9305-support-gap-hausdorff/**

permissions:
  contents: read

concurrency:
  group: height-1e14-support-scale-${{ github.ref }}
  cancel-in-progress: true

jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install rigorous backends
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y libflint-dev libmpfr-dev libgmp-dev pkg-config
          python -m pip install --upgrade pip
          python -m pip install python-flint==0.9.0 mpmath==1.3.0
          pkg-config --modversion flint

      - name: Compile and test exact finite layers
        run: |
          set -euo pipefail
          python -m compileall -q \
            experiments/X-9301-zero-deflated-xi-modulus \
            experiments/X-9304-sign-chain-zero-bins \
            experiments/X-9305-support-gap-hausdorff
          python -m unittest discover \
            -s experiments/X-9304-sign-chain-zero-bins/tests -v
          python -m unittest discover \
            -s experiments/X-9305-support-gap-hausdorff/tests -v

      - name: Import reviewed total-count producer
        shell: bash
        run: |
          set -euo pipefail
          source_branch=claude/riemann-counterexample-pipeline-io8s2k
          git fetch --no-tags --depth=1 origin "$source_branch"
          source_commit=$(git rev-parse FETCH_HEAD)
          git show "$source_commit:experiments/X-5604-exact-slab-discrepancy/slab_discrepancy.py" \
            >/tmp/slab_discrepancy.py
          out=experiments/X-9305-support-gap-hausdorff/results/height-1e14
          mkdir -p "$out"
          printf '%s\n' "$source_commit" >"$out/imported-source-commit.txt"
          sha256sum /tmp/slab_discrepancy.py >"$out/imported-source.sha256"

      - name: Recompute exact 50-unit slab count at two precisions
        shell: bash
        run: |
          set -euo pipefail
          out=experiments/X-9305-support-gap-hausdorff/results/height-1e14
          a=200000000000001/2
          b=200000000000101/2
          target=200000000000051/2
          for precision in 192 256; do
            /usr/bin/time -v python /tmp/slab_discrepancy.py \
              --a "$a" --b "$b" --target "$target" \
              --prec "$precision" --out "$out/count-p${precision}.json" \
              2>"$out/count-p${precision}.time.txt"
          done
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('experiments/X-9305-support-gap-hausdorff/results/height-1e14')
          rows=[json.loads((root/f'count-p{p}.json').read_text()) for p in (192,256)]
          for row in rows:
              assert row['schema']=='riemann.x5604-slab-discrepancy.v1'
              assert row['N_total_in_slab']==242
              assert row['N_b']['integer']-row['N_a']['integer']==242
              assert row['target']['strictly_inside'] is True
          assert rows[0]['N_a']['integer']==rows[1]['N_a']['integer']
          assert rows[0]['N_b']['integer']==rows[1]['N_b']['integer']
          (root/'count-comparison.json').write_text(json.dumps({
              'schema':'riemann.x9305-height-1e14-count-comparison.v1',
              'precisions':[192,256],
              'N_a':rows[0]['N_a']['integer'],
              'N_b':rows[0]['N_b']['integer'],
              'N_total':242,
              'verdict':'EXACT_242_COUNT_REPRODUCED'
          },indent=2,sort_keys=True)+'\n')
          PY

      - name: Construct a saturated sign chain from Gram sampling
        shell: bash
        run: |
          set -euo pipefail
          out=experiments/X-9305-support-gap-hausdorff/results/height-1e14
          /usr/bin/time -v python \
            experiments/X-9304-sign-chain-zero-bins/build_gram_sign_chain_certificate.py \
            --slab-lower 200000000000001/2 \
            --slab-upper 200000000000101/2 \
            --total-count 242 \
            --total-count-source "$out/count-p256.json" \
            --target 200000000000051/2 \
            --bits 36 --workers 4 --max-rounds 8 \
            --precision-ladder 128,192,256,384,512,768 \
            --output "$out/sign-chain.json" \
            2>"$out/sign-chain.time.txt"
          python experiments/X-9304-sign-chain-zero-bins/verify_sign_chain.py \
            "$out/sign-chain.json" --output "$out/sign-chain-verification.json"

      - name: Produce configured support-scale direct-xi rectangles
        shell: bash
        run: |
          set -euo pipefail
          out=experiments/X-9305-support-gap-hausdorff/results/height-1e14
          config=experiments/X-9305-support-gap-hausdorff/configs/height-1e14-support-scale.json
          for precision in 192 256; do
            /usr/bin/time -v python \
              experiments/X-9305-support-gap-hausdorff/produce_configured_support_scale_primitives.py \
              "$config" --precision "$precision" --series-cap 2 \
              --output "$out/primitives-p${precision}.json" \
              2>"$out/primitives-p${precision}.time.txt"
          done

      - name: Remove all 242 slab factors and contract 455 support rows
        shell: bash
        run: |
          set -euo pipefail
          out=experiments/X-9305-support-gap-hausdorff/results/height-1e14
          for precision in 192 256; do
            set +e
            python experiments/X-9305-support-gap-hausdorff/build_from_support_scale_primitives.py \
              "$out/primitives-p${precision}.json" "$out/sign-chain.json" \
              --log-terms 768 --output "$out/certificate-p${precision}.json"
            status=$?
            set -e
            test "$status" -le 1
            set +e
            python experiments/X-9305-support-gap-hausdorff/verify_support_gap.py \
              "$out/certificate-p${precision}.json" \
              --output "$out/verification-p${precision}.json"
            status=$?
            set -e
            test "$status" -le 1
          done

      - name: Require primitive and support-row precision nesting
        shell: bash
        run: |
          set -euo pipefail
          out=experiments/X-9305-support-gap-hausdorff/results/height-1e14
          python - <<'PY'
          import json
          from fractions import Fraction
          from pathlib import Path
          root=Path('experiments/X-9305-support-gap-hausdorff/results/height-1e14')
          p192=json.loads((root/'primitives-p192.json').read_text())
          p256=json.loads((root/'primitives-p256.json').read_text())
          v192=json.loads((root/'verification-p192.json').read_text())
          v256=json.loads((root/'verification-p256.json').read_text())
          def f(raw): return Fraction(raw['numerator'],raw['denominator'])
          def nested(low,high):
              return f(low['lower']) <= f(high['lower']) <= f(high['upper']) <= f(low['upper'])
          assert [p['id'] for p in p192['points']]==[p['id'] for p in p256['points']]
          primitive_failures=[]
          for low,high in zip(p192['points'],p256['points']):
              assert low['u']==high['u']
              for axis in ('real','imag'):
                  if not nested(low['xi_rectangle'][axis],high['xi_rectangle'][axis]):
                      primitive_failures.append(low['id']+':'+axis)
          assert [r['id'] for r in v192['rows']]==[r['id'] for r in v256['rows']]
          row_failures=[]
          for low,high in zip(v192['rows'],v256['rows']):
              if not nested(low['interval'],high['interval']):
                  row_failures.append(low['id'])
          summary={
              'schema':'riemann.x9305-height-1e14-precision-comparison.v1',
              'all_primitives_nested':not primitive_failures,
              'all_rows_nested':not row_failures,
              'primitive_failures':primitive_failures,
              'row_failures':row_failures,
          }
          assert not primitive_failures and not row_failures, summary
          (root/'precision-comparison.json').write_text(
              json.dumps(summary,indent=2,sort_keys=True)+'\n')
          PY

      - name: Summarize and nominate only a strict directed negative
        shell: bash
        run: |
          set -euo pipefail
          out=experiments/X-9305-support-gap-hausdorff/results/height-1e14
          python - <<'PY'
          import json
          from fractions import Fraction
          from pathlib import Path
          root=Path('experiments/X-9305-support-gap-hausdorff/results/height-1e14')
          result=json.loads((root/'verification-p256.json').read_text())
          chain=json.loads((root/'sign-chain-verification.json').read_text())
          def f(raw): return Fraction(raw['numerator'],raw['denominator'])
          def midpoint(row): return (f(row['interval']['lower'])+f(row['interval']['upper']))/2
          tight=min(result['rows'],key=lambda row:abs(midpoint(row)))
          summary={
              'schema':'riemann.x9305-height-1e14-summary.v1',
              'slab':{'lower':'200000000000001/2','upper':'200000000000101/2'},
              'target':'200000000000051/2',
              'exact_total_count':242,
              'certified_simple_line_zero_bins':chain['total_count'],
              'support_gap':result['support_gap'],
              'point_count':15,
              'row_count':len(result['rows']),
              'verdict':result['verdict'],
              'certified_negative_rows':result['certified_negative_rows'],
              'unresolved_rows':result['unresolved_rows'],
              'tightest_row_id':tight['id'],
              'tightest_row_status':tight['status'],
              'tightest_row_interval':tight['interval'],
              'counterexample_nomination':(
                  'PENDING_INDEPENDENT_REPRODUCTION_AND_ANALYTIC_REVIEW'
                  if result['certified_negative_rows'] else None
              )
          }
          (root/'summary.json').write_text(json.dumps(summary,indent=2,sort_keys=True)+'\n')
          print(json.dumps(summary,indent=2,sort_keys=True))
          PY
          find "$out" -type f ! -name SHA256SUMS -print0 | sort -z | \
            xargs -0 sha256sum >"$out/SHA256SUMS"

      - name: Upload proof and diagnostic artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: height-1e14-support-scale-hausdorff
          path: experiments/X-9305-support-gap-hausdorff/results/height-1e14/
          retention-days: 30
          if-no-files-found: warn

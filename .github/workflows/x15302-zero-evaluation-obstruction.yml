name: x15302-zero-evaluation-obstruction

on:
  push:
    branches:
      - agent/gpt56-03-j/143-exact-radical-target
      - agent/gpt56-03-j/143-zero-evaluation-low-split
    paths:
      - '.github/workflows/x15302-zero-evaluation-obstruction.yml'
      - 'claims/lemmas/L-15304-zero-evaluation-obstruction-to-full-packet-repair.md'
      - 'experiments/X-15302-zero-evaluation-obstruction/**'
  pull_request:
    branches:
      - agent/gpt56-pro-09-b/143-squared-residual-floor
    paths:
      - '.github/workflows/x15302-zero-evaluation-obstruction.yml'
      - 'claims/lemmas/L-15304-zero-evaluation-obstruction-to-full-packet-repair.md'
      - 'experiments/X-15302-zero-evaluation-obstruction/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-controls:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Compile checker
        run: |
          python -m compileall -q \
            experiments/X-15302-zero-evaluation-obstruction
      - name: Run mutation suite
        run: |
          python -m unittest discover \
            -s experiments/X-15302-zero-evaluation-obstruction/tests -v
      - name: Replay retained exact control
        run: |
          python experiments/X-15302-zero-evaluation-obstruction/verify.py \
            experiments/X-15302-zero-evaluation-obstruction/certificates/synthetic.json \
            --output /tmp/zero-obstruction.json
          cmp \
            experiments/X-15302-zero-evaluation-obstruction/results/synthetic-verification.json \
            /tmp/zero-obstruction.json

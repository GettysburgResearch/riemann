name: X-18505 real Suzuki P1 certificate

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'experiments/X-18505-real-suzuki-p1/**'
      - '.github/workflows/x18505-real-suzuki-p1.yml'

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Reproduce directed artifact
        working-directory: experiments/X-18505-real-suzuki-p1
        run: |
          python3 produce.py
          python3 verify.py
          python3 -m unittest discover -s tests -v
          sha256sum -c SHA256SUMS
          git diff --exit-code -- .
      - name: Independent midpoint backend
        working-directory: experiments/X-18505-real-suzuki-p1
        run: |
          python3 -m pip install --disable-pip-version-check mpmath==1.3.0
          python3 independent_midpoint.py
          git diff --exit-code -- results/independent-midpoint-replay.json

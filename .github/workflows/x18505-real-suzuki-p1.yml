name: X-18505 real Suzuki P1 certificate

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'experiments/X-18505-real-suzuki-p1/**'
      - '.github/workflows/x18505-real-suzuki-p1.yml'

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Reassemble immutable proof bundle
        run: |
          cat experiments/X-18505-real-suzuki-p1/bundle/bundle.part* > /tmp/X-18505-real-suzuki.tar.gz
          echo '2ecf60c1e7c24a306be2432780388177d68b6176d3b4dfcb8cbc276dc5b884ae  /tmp/X-18505-real-suzuki.tar.gz' | sha256sum -c -
          mkdir -p /tmp/x18505
          tar -xzf /tmp/X-18505-real-suzuki.tar.gz -C /tmp/x18505
      - name: Reproduce directed artifact and exact LDL verdict
        working-directory: /tmp/x18505/X-18505-real-suzuki
        run: |
          python3 produce.py
          python3 verify.py
          python3 -m unittest discover -s tests -v
          sha256sum -c SHA256SUMS
      - name: Independent midpoint backend
        working-directory: /tmp/x18505/X-18505-real-suzuki
        run: |
          python3 -m pip install --disable-pip-version-check mpmath==1.3.0
          python3 independent_midpoint.py
          sha256sum -c SHA256SUMS

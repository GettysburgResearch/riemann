name: arb-xi-dual-grid

on:
  push:
    branches:
      - agent/gpt56-06-d/66-arb-xi-dual-portfolio
    paths:
      - '.github/workflows/arb-xi-dual-grid.yml'
      - 'experiments/X-3902-arb-xi-passivity/rs_grid.c'
      - 'experiments/X-3902-arb-xi-passivity/verify_certificate.py'
      - 'experiments/X-3902-arb-xi-passivity/verify_value_certificate.py'
      - 'experiments/X-6601-arb-xi-dual-portfolio/**'
  workflow_dispatch:

concurrency:
  group: arb-xi-dual-grid-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  feature-table:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install FLINT development library
        run: |
          sudo apt-get update
          sudo apt-get install -y libflint-dev pkg-config
          pkg-config --modversion flint
      - name: Compile producer and exact checker
        run: |
          mkdir -p experiments/X-6601-arb-xi-dual-portfolio/results/arb-256
          cc -O3 -std=c11 -Wall -Wextra -Werror \
            experiments/X-3902-arb-xi-passivity/rs_grid.c \
            -o experiments/X-6601-arb-xi-dual-portfolio/rs_grid \
            -lflint -lmpfr -lgmp -lpthread -lm
          python -m compileall -q \
            experiments/X-3902-arb-xi-passivity/verify_certificate.py \
            experiments/X-3902-arb-xi-passivity/verify_value_certificate.py
      - name: Produce 256-bit primitive table
        run: |
          /usr/bin/time -v \
            experiments/X-6601-arb-xi-dual-portfolio/rs_grid 256 \
            > experiments/X-6601-arb-xi-dual-portfolio/results/arb-256/feature-table.certificate.json \
            2> experiments/X-6601-arb-xi-dual-portfolio/results/arb-256/feature-table.time.txt
      - name: Replay imported channels exactly
        run: |
          python experiments/X-3902-arb-xi-passivity/verify_value_certificate.py \
            experiments/X-6601-arb-xi-dual-portfolio/results/arb-256/feature-table.certificate.json \
            --output experiments/X-6601-arb-xi-dual-portfolio/results/arb-256/feature-table.verification.json
          python - <<'PY'
          import json
          p='experiments/X-6601-arb-xi-dual-portfolio/results/arb-256/feature-table.verification.json'
          d=json.load(open(p))
          print(json.dumps({k:d[k] for k in ('verified','status','point_count','channel_count','negative_channels','unresolved_channels','verification_sha256')},indent=2))
          if not d['verified'] or d['negative_channels'] or d['unresolved_channels']:
              raise SystemExit('imported-channel replay was not a clean nonnegative control')
          PY
      - name: Upload proof-grade feature table
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: arb-xi-dual-feature-table-256
          if-no-files-found: error
          path: experiments/X-6601-arb-xi-dual-portfolio/results/arb-256/

name: arb-xi-complex-candidate

on:
  push:
    branches:
      - agent/gpt56-03-f/39-complex-pick-recheck
    paths:
      - '.github/workflows/arb-xi-complex-candidate.yml'
      - 'experiments/X-3904-complex-pick-recheck/**'
  pull_request:
    branches:
      - agent/gpt56-03-e/39-arb-xi-passivity
    paths:
      - '.github/workflows/arb-xi-complex-candidate.yml'
      - 'experiments/X-3904-complex-pick-recheck/**'
  workflow_dispatch:

concurrency:
  group: arb-xi-complex-candidate-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  complex-candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install FLINT development library
        run: |
          sudo apt-get update
          sudo apt-get install -y libflint-dev pkg-config
          pkg-config --modversion flint
      - name: Compile producer and run exact checker tests
        run: |
          mkdir -p experiments/X-3904-complex-pick-recheck/results/complex-candidate
          cc -O3 -std=c11 -Wall -Wextra -Werror \
            experiments/X-3904-complex-pick-recheck/rs_complex_candidate.c \
            -o experiments/X-3904-complex-pick-recheck/rs_complex_candidate \
            -lflint -lmpfr -lgmp -lpthread -lm
          python -m compileall -q \
            experiments/X-3904-complex-pick-recheck/verify_complex_pick.py \
            experiments/X-3904-complex-pick-recheck/tests
          python -m unittest discover \
            -s experiments/X-3904-complex-pick-recheck/tests -v
      - name: Produce and replay directed precision ladder
        run: |
          for bits in 192 256 384 512 768; do
            /usr/bin/time -v \
              experiments/X-3904-complex-pick-recheck/rs_complex_candidate "$bits" \
              > "experiments/X-3904-complex-pick-recheck/results/complex-candidate/jm15-${bits}.certificate.json" \
              2> "experiments/X-3904-complex-pick-recheck/results/complex-candidate/jm15-${bits}.time.txt"
            python experiments/X-3904-complex-pick-recheck/verify_complex_pick.py \
              "experiments/X-3904-complex-pick-recheck/results/complex-candidate/jm15-${bits}.certificate.json" \
              --output "experiments/X-3904-complex-pick-recheck/results/complex-candidate/jm15-${bits}.verification.json"
            cat "experiments/X-3904-complex-pick-recheck/results/complex-candidate/jm15-${bits}.verification.json"
          done
      - name: Upload exact complex-candidate ladder
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: arb-xi-complex-candidate-jm15
          if-no-files-found: error
          path: experiments/X-3904-complex-pick-recheck/results/complex-candidate/

name: T105210 seven-point record audit

on:
  push:
    branches:
      - research/gpt56-pro/105200-xi-residue-rigidity
  workflow_dispatch:

permissions:
  contents: read

jobs:
  arb-record-certificate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out current research branch
        uses: actions/checkout@v4

      - name: Check out pinned external verifier
        uses: actions/checkout@v4
        with:
          repository: ainta/zeta-simple-zeros
          ref: 040c5e899e658aed7b56a2a87f501798fe10761d
          path: upstream

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install pinned arithmetic stack
        run: |
          python -m pip install --upgrade pip
          python -m pip install python-flint==0.9.0
          python -m pip install --no-deps -e upstream

      - name: Verify upstream tests and certificates
        run: |
          python -m unittest discover -s upstream/tests -v
          zeta-zero-verify three --json | tee three-point.json
          zeta-zero-verify seven --json --progress-every 1000000 | tee seven-point.json

      - name: Verify local-to-global constant algebra
        run: |
          python - <<'PY' | tee global-constant.txt
          import math
          H0 = 1.5 - math.cos(1 / math.sqrt(2)) / (
              math.sqrt(2) * math.sin(1 / math.sqrt(2))
          )
          epsilon = 221 / 1_000_000
          three = (H0 - epsilon / 4) / (1 - epsilon / 2)
          seven = (1_345_000 * H0 - 2_680) / 1_340_003
          assert three > H0
          assert seven > three
          print(f'H0={H0:.16f}')
          print(f'three_point_bound={three:.16f}')
          print(f'seven_point_bound={seven:.16f}')
          print(f'seven_point_improvement={seven-H0:.16f}')
          PY

      - name: Upload audit logs
        uses: actions/upload-artifact@v4
        with:
          name: t105210-seven-point-record-audit
          path: |
            three-point.json
            seven-point.json
            global-constant.txt
          if-no-files-found: error
